---
# The local cluster's ClusterIssuer: a self-signed CA, for the `.test` hosts.
#
# WHY THIS EXISTS AND WHY IT IS NOT LET'S ENCRYPT. PLAN-names-urls-rollout
# §3 L8 asks for cert-manager with "a local clusterIssuer (self-signed CA)"
# and the reason is not thrift. Let's Encrypt signs a name that publicly
# resolves, and `.test` is the reserved-for-testing TLD (RFC 2606 §2, with
# `.invalid`, `.localhost` and `.example`) — it is guaranteed never to appear
# in the root zone, so an ACME HTTP-01 challenge for it can never be
# satisfied by a public name. A local cluster therefore uses a CA it carries
# itself.
#
# WHY SELF-SIGNED AND NOT A LOCAL ACME SERVER. cert-manager's `selfSigned`
# issuer needs no second deployment, no sidecar, no port, and it is the one
# shape whose failure cannot be confused with the thing under test: if a
# certificate does not appear, it is the cluster's, not a test harness's. A
# local `pebble` or `step-ca` is more machinery standing between a green pod
# and the answer "the Ingress is wired".
#
# THE COST, STATED UP FRONT. A self-signed CA is trusted by nothing outside
# this cluster, so a browser reaching `https://api.anywaye.test` shows an
# untrusted-chain warning unless the CA certificate is imported into the
# machine's trust store. That is expected locally and is NOT a defect: the
# local cluster's job is to prove the SHAPE — the Ingress exists, the
# annotation resolves to an issuer, cert-manager issues the certificate into
# the named secret, Traefik presents it — not that a public chain of trust
# holds. To silence the warning, extract the root and trust it:
#
#   kubectl -n cert-manager get secret anywaye-test-ca-ca \
#     -o jsonpath='{.data.ca\.crt}' | base64 -d > anywaye-test-ca.crt
#   sudo security add-trusted-cert -d -r trustRoot \
#     -k /Library/Keychains/System.keychain anywaye-test-ca.crt
#
# THE NAME IS THE CONTRACT. The generated charts annotate their Ingresses
# with `ingress.clusterIssuer` and conventionally name `letsencrypt-prod`
# (kit/templates/substrate/manifests/tls/clusterissuer.yaml — "the names are
# a contract"). This issuer is named `anywaye-test-ca` so a chart left
# pointing at `letsencrypt-prod` on a local cluster FAILS to issue rather
# than silently getting something: an annotation naming an issuer this
# cluster does not have is a loud failure, and a name collision with the
# production issuer would be a quiet one.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: anywaye-test-ca
spec:
  selfSigned: {}
---
# The CA's root certificate, and the only reason the issuer above is enough.
#
# cert-manager's selfSigned issuer signs whatever a Certificate asks for,
# directly, with the key that Certificate names. That is the whole mechanism
# and it needs no second Issuer object of kind `CA`. This Certificate exists
# so the CA's root is a real, extractable, stable object rather than an
# artefact of the first issuance: every Certificate this file issues is
# signed by `anywaye-test-ca-ca`, and `isCA: true` here is what makes that key
# usable as a root at all.
#
# `secretName` is the one place the key lives. It is generated by
# cert-manager, in the cluster, and never committed — the same "names the
# secret and never contains the credential" discipline the charts' own
# `secretName`/`imagePullSecrets` blocks follow.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: anywaye-test-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: anywaye-test-ca
  secretName: anywaye-test-ca-ca
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: anywaye-test-ca
    kind: ClusterIssuer
    group: cert-manager.io
