# Local (`anywaye-local`) values for the gateway chart. The `.test` front door.
#
# The chart's own `charts/gateway/values.yaml` names `api.anywaye.com` and
# `letsencrypt-prod` — the launch shape. This file changes the host and the
# issuer for the local cluster and nothing else; the chart keeps its default
# for production. See deploy/local/values/README.md for the key-name table.
image:
  repository: anywaye/gateway
  tag: k8s-local
  # `Never`: the image is in the cluster's containerd store because
  # `bin/local-cluster` ran `k3d image import anywaye/gateway:k8s-local`. A
  # pull from ghcr.io would both fail (no credential on a dev cluster) and
  # defeat the point of a locally built image.
  pullPolicy: Never

replicaCount: 1

ingress:
  enabled: true
  className: traefik
  # §1's URL map: api.anywaye.test is gateway.
  host: api.anywaye.test
  # `anywaye-test-ca`, the local self-signed ClusterIssuer
  # (`deploy/local/clusterissuer-anywaye-test.yaml`). The chart's default names
  # `letsencrypt-prod`, which this cluster does not have — see the file's own
  # comment on why the name is a contract.
  clusterIssuer: anywaye-test-ca
  tls:
    enabled: true
    secretName: gateway-tls

env:
  PORT: "8080"
  # The local cluster's identity, reached two ways on purpose: JWKS over the
  # EDGE (the same origin a browser would use, because that is the host the
  # issuer's `iss` claim is checked against), and sessions by in-cluster
  # Service name (`http://identity:8080` — inside a cluster `localhost` is
  # gateway itself). Production's `https://identity.anywaye.com` becomes
  # `http://auth.anywaye.test` here, which is the whole reason the `.test` URL
  # map is exercised at all: one hop is a public-looking issuer check and the
  # other is a service discovery, and the chart carries both.
  IDENTITY_ISSUER: "http://auth.anywaye.test"
  # MEASURED. The chart's default is `http://identity:8080` and its comment says
  # it "must match identity's own chart (release `identity` in this namespace)".
  # That comment describes a SINGLE-NAMESPACE deployment, and the fleet is not
  # one: every generated chart carries `namespace: identity` and deploys one
  # Service per namespace named after the service. So the address that resolves
  # from the gateway namespace is `identity.identity.svc.cluster.local`, and
  # `http://identity:8080` fails DNS with "Could not resolve host" — which
  # gateway reports as `{"identity":"unavailable"}` on /readyz rather than as a
  # crash, so a chart default that cannot work looks like a dependency outage.
  # Measured: `curl http://identity:8080/healthz` from a pod in `gateway` →
  # curl (6) Could not resolve host.
  IDENTITY_URL: "http://identity.identity.svc.cluster.local:8080"
  GATEWAY_CLIENT_ID: "gateway"
  IDENTITY_JWKS_TTL_MS: "300000"
  RATE_LIMIT_REQUESTS: "600"
  RATE_LIMIT_WINDOW_MS: "60000"
  # Traefik appends one hop behind the edge, locally the same as production.
  TRUSTED_PROXIES: "1"
  # Unchanged from the chart: the in-cluster pantry address is the same name.
  ROUTE_TABLE: '{"/v1/pantry":{"baseUrl":"http://pantry:8080","public":true},"/v1/pantry-writes":{"baseUrl":"http://pantry:8080","principal":["sub"]}}'
  ASSERTION_TTL_MS: "120000"
  ASSERTION_SIGNING_KEY_FILE: "/etc/gateway/assertion/signing.pem"

# Names only — the secrets are created out of band by `bin/local-cluster`,
# never rendered here. `gateway-secrets` must carry REDIS_URL and
# ASSERTION_SIGNING_KEY, or the pod does not start at all (the chart's
# required-secretKeyRef design: a deployment cannot forget Redis).
secrets:
  redisUrlSecretName: gateway-secrets
  redisUrlSecretKey: REDIS_URL
  assertionKeySecretName: gateway-secrets
  assertionKeySecretKey: ASSERTION_SIGNING_KEY
