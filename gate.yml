    # The tally `tests/validate-ci.sh` prints, which is the second half of this
    # gate: the checks that the tree still has the shape CI assumes — one
    # runtime pin, `npm ci` and not `npm install`, the gate command, the
    # end-to-end tier's shape, and now the deployment story's shape.
    #
    # 47 is this repository's DECLARED count. This packet did NOT raise it,
    # and the reason is worth a sentence rather than silence: the typecheck
    # packet EXTENDED the check that already pinned bin/prime's command list
    # (one check, one verdict — naming a fifth command in the same exact-match
    # list is not a new check), so the line above this comment still reads 47
    # and the tally line agrees with it. One breakage was added, which is the
    # other proof below, and that number is the one that moved.
    #
    # WHY THE FLOOR IS THE FIRST NUMBER AND NOT THE PASSED COUNT, which is the
    # whole content of this packet and the defect the TanStack migration
    # introduced. This used to read the PASSED count, and the passed count is a
    # measurement of one fully-loaded machine:
    #
    #   caf + shellcheck + docker   46 passed, 0 failed, 0 skipped
    #   no caf                      45 passed, 0 failed, 1 skipped
    #   no caf, no docker           44 passed, 0 failed, 2 skipped
    #   and no shellcheck either    43 passed, 0 failed, 3 skipped
    #
    # Three checks in that script are gated on a tool this repository does not
    # require — `caf` for the manifest parse, `shellcheck` for the self-lint,
    # `docker` for the provenance verifier — and each prints SKIP rather than
    # PASS when the tool is absent. So `46` was a floor on "this machine has
    # caf", it went red on every machine that is not the machine the numbers
    # were read off, and on this fleet — where "a check was deleted" and "a
    # check could not run" are the same event to a passed count — a passed-count
    # floor could not tell a deletion from an absent `caf` either. Every CI
    # runner is a machine without `caf`, which is how a merge went green
    # locally and red everywhere else.
    #
    # THE SUM IS THE DECLARED TOTAL, and that is what moves with the tree
    # instead. Every check the script reaches a verdict on reaches exactly one of
    # passed / failed / skipped, so passed + failed + skipped is the number of
    # checks this repository DECLARES, on every machine, whatever is installed:
    # 46 on the first line above and 46 on the last. Deleting a check moves it.
    # An absent `caf` moves only the split. That is the asymmetry a
    # decrease-detector needs, and it is why lowering this floor was not an
    # option: 46 -> 45 would have bought a green CI at the price of a floor that
    # can no longer notice a check going missing, which is the one thing a floor
    # is for. The old comment on this proof argued that the SKIPPED count is
    # machine-dependent and therefore must not be floored — true, and beside the
    # point, because the number that moved was the passed count and not the
    # skipped one.
    #
    # NO ESCAPE TOLERANCE HERE, and the difference is measured rather than
    # assumed. This line is a bash `printf` in `tests/validate-ci.sh`, and that
    # file contains no byte that can start an ANSI escape and no call to `tput`
    # — `grep -c $'\x1b' tests/validate-ci.sh` is 0. It cannot colourise, so a
    # pattern that tolerated colour here would be matching something the source
    # is incapable of printing, which is a weaker proof bought for nothing.
    # What changed since then is that this is a RULE with an assertion behind it
    # instead of a comment that decays: the declaration self-test greps the
    # source and fails if an ESC byte appears, so if somebody does add colour
    # here the assertion fires and the gate goes red at the same moment, which
    # is the right order to find out in.
    #
    # ONE CAPTURE GROUP, and the other three are read as numbers the pattern
    # deliberately does not floor. The failed count cannot move down without the
    # gate exiting 1 (`bin/prime` stops on it), and the passed count is machine
    # dependent in exactly the way this floor used to be.
    - id: ci-shape-checks
      match: '^([0-9]+) checks declared, [0-9]+ passed, [0-9]+ failed, [0-9]+ skipped$'
      minimum: 49
    # And the self-test, which is what makes the 49 above load-bearing: 55
    # throwaway copies of the tree, each broken one way, each asserted to go
    # red. A gate that runs the checks but silently stopped proving they can
    # fail would still print `49 checks declared` — this is the line that says
    # the rubber stamp was pressed.
    #
    # 52 -> 54 is the signup-key packet's: two breakages for one new check — the stack
    # wiring identity an ephemeral signup key. `the-stack-names-no-signup-key`
    # deletes the `SIGNUP_SIGNING_KEY` line from the compose document and
    # `the-harness-generates-no-signup-key` deletes the preflight call from
    # `bin/e2e-stack` — and each is asserted to send the script red. The 47
    # above moves too, to 48, and the symmetry is the point: this packet ADDED
    # a check rather than extending one, so the number of checks the script
    # reaches a verdict on went up by one alongside the two new ways it can be
    # proven to fail. A floor that did not move for a reason the tree contains
    # is a floor nobody can reconcile with the tally line.
    #
    # 54 -> 55 is m128's: one breakage for one new check — the e2e fixture
    # naming a billing service the stack does not run. `the-e2e-stack-
    # points-parlor-at-a-billing-service-it-does-not-run` re-adds
    # `BILLING_URL: "http://billing:3000"` to the compose document and is
    # asserted to send the script red. 48 moves to 49 alongside it, same
    # symmetry as the signup-key packet: a new check, a new way to prove it
    # fails.
    #
    # ALSO A DECLARED COUNT, AND FOR THE SAME REASON. The self-test used to
    # floor the number of breakages it PROVED, which on a machine without `caf`
    # is one short of the real list: exactly one breakage — the one that plants
    # an unquoted colon in `cafaye.yml` — can only be witnessed by `caf dev
    # --dry-run`, because every other check reads the manifest with `sed` line
    # matching and a document YAML cannot parse still matches all of them. Run
    # it without `caf` and the self-test asserted a check could fail, the check
    # declined to run, and the honest report was "a check that cannot fail" —
    # a true sentence and a false finding, which is the worst of both.
    #
    # So the proof now floors the number the repository DECLARES and the line
    # carries the split: `self_test: 54 breakages declared, 53 proven able to
    # fail, 1 unprovable on this machine`. The unprovable one is named on its own
    # line in the run, counted here, and NEVER counted as proven. It is not
    # skipped to make this green — a skip that nobody is forced to notice is not
    # a pass (PLAN.md §1) — and the declared count stays at 51 either way, so
    # deleting a breakage still moves this floor.
    #
    # Also a bash `printf` in the same file and also plain by construction, for
    # the same measured reason as the proof above. `^self_test:` is anchored hard
    # enough that nothing else in a vitest or npm log can be mistaken for it;
    # the earlier `self_test:` lines this script prints on a failure do not match
    # either, because the pattern needs the digits immediately after the colon.
    - id: check-self-test
      match: '^self_test: ([0-9]+) breakages declared'
      minimum: 55
  # NOT PROVED, and named here rather than left to be discovered: a proof is a
  # line of output. `484 passed` proves 484 tests ran; it does not prove the
  # tests touched identity, because they do not — the identity and billing
  # clients are stubbed in the render rig and `src/lib/identity.test.ts`
  # replaces global fetch with a function that throws. Proving that the tests
  # hit what they claim to is MD12's collect-then-run machinery, owed in `caf`,
  # and core's harness/gate_findings.json names it as a thing this format does
  # not do.

