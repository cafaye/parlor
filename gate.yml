# gate.yml — how parlor is gated, declared rather than guessed.
#
# WHY THIS FILE EXISTS. `core` ships the format (schemas/gate.schema.json) and
# the checker (harness/gate_check.py), and its own docs/gate.md measures the
# thing this file answers: across the fifteen repositories in this workspace,
# "run the gate" had five different spellings, and every one of the bad runs was
# found by a person getting it wrong rather than by a check. parlor was already
# in the majority spelling — `mise run prime` — so the file here is not about
# which command runs. It is about the three things a mise task structurally
# cannot hold, and that a next reader would otherwise have to infer:
#
#   1. WHAT the gate needs from the machine that is not this repository. See
#      `external` below. The honest answer used to live in a comment at the top
#      of mise.toml, and a comment is not checkable.
#   2. WHETHER THE GATE RAN, as opposed to exited zero. See `proof` below.
#   3. THAT CI RUNS THE SAME GATE. See `ci` below.
#
# Every number in this file was read out of a real run of this repository's gate
# on 2026-09-30, not copied from another repository's declaration, and every
# one of them was read out of CAPTURED BYTES rather than off a terminal. The
# last clause is not a style note: the `suite` proof below was written by
# somebody who read a terminal, and that is the whole reason this file was
# wrong once. See the proof's own comment.
version: 1
name: parlor

gate:
  # An argv, never a shell string, so the exit code is the gate's own. This
  # fleet's one recorded false green was `... | tail -45; echo "PRIME EXIT=$?"`
  # under zsh, where `$?` is tail's exit code and tail is always 0.
  command: [./bin/prime]
  # The fleet's spelling, and it is already the one AGENTS.md documents. Named
  # here so `mise run prime` and gate.yml cannot be two different gates.
  miseTask: prime
  # The file behind the command, and the file `[tasks.prime].run` must resolve
  # to. `mise.toml` says `run = "./bin/prime"`; the checker cross-checks that
  # against this line, so a task that drifted onto another file is a finding
  # rather than a quiet disagreement.
  entrypoint: bin/prime
  # Deliberately generous, and the reasoning is the same as core's. The long
  # pole is `npm ci` on a COLD checkout: on this machine two runs took 46s and
  # 16s, both with node_modules absent and the npm cache warm, and a fresh CI
  # runner with an empty cache and a cold registry connection is minutes. A warm
  # run of this gate — node_modules present, npm cache warm — measured 79s end
  # to end on 2026-09-30 (`real 79.02s`), of which `npm ci` was 11s and vitest
  # 7.8s and the rest the static checks and their 42-breakage self-test. A
  # budget tight enough to be a bug detector would be a flake generator on the
  # first CI run of the day, and a timeout that fires on a cold cache is
  # `gate.timeout`, which reads as "the gate hung" and is really "the budget
  # was a guess".
  timeoutSeconds: 900
  # Three proofs, because `bin/prime` runs three separately-countable things
  # and "the gate exited 0" says nothing about any of them. A proof is a line
  # the gate's own output must contain, with a floor read from one capture
  # group, so a run that skipped a step and exited zero is a FAILURE and not a
  # smaller green. This is the defect in `cafaye-rb`, where the database tier
  # never executed once and the run printed `ok`. Each of the three below is
  # the one line that cannot appear unless its step ran to the end, so a
  # `bin/prime` that quietly stopped doing one of the three is red rather than
  # a green with a smaller number in it.
  proof:
    # THE VITEST SUMMARY. Read the rest of this comment before you "simplify"
    # the pattern, because every clause left in it is here because of something
    # it has to REJECT — and the one clause that has nothing to do with colour,
    # the `(?!…\|)`, is the only part of this pattern that ever made it stricter
    # than the one it replaced.
    #
    # WHAT THE BYTES ACTUALLY ARE. `bin/prime` runs `npm test`, the checker
    # captures that with `subprocess.run(..., capture_output=True)`, and the
    # bytes on disk in the checker's `gate.log` for the summary line are, with
    # colour forced on:
    #
    #     \x1b[2m      Tests \x1b[22m \x1b[1m\x1b[32m377 passed\x1b[39m\x1b[22m\x1b[90m (377)\x1b[39m
    #
    # and with colour off:
    #
    #     <6 spaces>Tests  377 passed (377)
    #
    # Both were measured, from two runs of this repository's own gate on
    # 2026-09-30 that differ only in FORCE_COLOR. `^[ ]*` — which is what this
    # pattern said when the manager found it red — cannot match the first,
    # because the line begins with an escape and not with a space, and so the
    # checker reported `gate.proof-missing` about a gate that had proved, in
    # the same log, that it ran 377 tests. Three other cases failed the same
    # way, all of them fixtures that should have been caught by `gate.floor`
    # and were caught by `gate.proof-missing` instead, because the floor is
    # never read when the proof never matched.
    #
    # WHY THE ORIGINAL WAS WRONG. It was written by reading a terminal. A
    # person looking at vitest's output sees `Tests  377 passed` in plain text
    # whether or not the bytes behind it are decorated. The checker reads the
    # bytes. Those are two different streams and only one of them is something
    # a person can eyeball a regular expression against, which means the
    # obvious way to write a correct pattern is the way that fails.
    #
    # WHAT CORE DOES WITH THE BYTES, AND WHY THIS PATTERN NO LONGER SAYS
    # ANYTHING ABOUT THEM. `core` ruling MD17 landed as `core-13` (`c63af27`):
    # `harness/gate_check.py` strips terminal escapes from the gate's captured
    # output, in exactly one place — `prove()`, where the output is read — and
    # applies every `proof[].match` to the stripped text. The log on disk keeps
    # the raw bytes, because the log is the operator's evidence and a log that
    # disagreed with the output it records would be a worse lie than the one
    # being fixed.
    #
    # This pattern used to carry `(?:[ ]|\x1b\[[0-9;]*m)*` three times. That was
    # a WORKAROUND FOR THAT SAME CORE DEFECT, carried here so the repository
    # could gate itself before the ruling existed — and it is DELETED. The order
    # mattered: deleting it before `core-13` landed would have put this proof
    # back to red on every machine whose tools colourise, which is the defect
    # this pattern was written in the first place.
    #
    # DELETING IT IS A TIGHTENING AND NOT A SIMPLIFICATION, and here is the case
    # that proves it. The run could match nothing at all, so `Tests` and the
    # digits could sit next to each other with nothing between them: on the
    # stripped bytes `      Tests377 passed (377)` the old pattern matched and
    # read 377, and this one refuses the line. `vitest` always prints a space
    # there, so a line without one is not a summary this proof should be reading
    # a floor off. `tests/gate-declaration-self-test.sh` asserts that on the
    # fixture, and separately asserts that no `match:` in this file names a
    # terminal escape at all — so putting the tolerance back is a red, not a
    # question for the next reviewer.
    #
    # WHAT CORE DOES NOT STRIP, so nobody has to rediscover it: an UNTERMINATED
    # escape sequence is left in place on purpose, because consuming it to the
    # end of the input would swallow the proof line with it and turn an absent
    # proof into a green. A gate that emits one is malformed, and a malformed
    # gate is allowed to fail loudly. `core`'s `docs/gate.md` has the table of
    # what is handled; "The output is matched colour-free" is the section.
    #
    # THE SAME REASONING IS WHY THE SELF-TEST'S CONTROL RUNS TWICE, and after
    # `core-13` the second one has a second job. A control that only passes
    # where nothing colourises is a control that reports the day, not the
    # repository, which is how this pattern came to be shipped in a state its own
    # self-test called green. With `core` stripping, control 1 is now insensitive
    # to colour by construction — so control 2, which runs the real gate with
    # `FORCE_COLOR=1` in the environment the checker captures it in, is no longer
    # testing this declaration. It is the regression control on the STRIPPER:
    # the day `core` stops stripping, that is the case that goes red, and it is
    # the only one that would. Do not delete it to save a minute of wall clock.
    #
    # THE PATTERN, PART BY PART, because "it is a long regex" is not a reason:
    #
    #   ^[ ]*          the indent `vitest` puts in front of `Tests`, or none of
    #                  it. A terminal shows that indent and so does the stripped
    #                  line, and it is the one clause this pattern had before any
    #                  of this packet's work: the spaces are not the escape
    #                  tolerance, and deleting the tolerance did not delete them.
    #   Tests          the word. `Test Files  17 passed (17)` is one line above
    #                  it and does NOT match, because "Tests" is not a prefix of
    #                  "Test Files" — `Test` is followed by a space, not an `s`.
    #                  The file count can never satisfy this floor, and that is
    #                  asserted by a case in the self-test rather than left to a
    #                  comment.
    #   [ ]+           AT LEAST ONE space. This is where the tightening lives:
    #                  the escape run that used to sit here could stand in for
    #                  the space and match nothing, and a space that can be
    #                  absent is not a separator.
    #   ([0-9]+)       the one and only capture group. The checker reads the
    #                  floor from exactly one, and reports `gate.proof-invalid`
    #                  for zero or for two, so every other group here is
    #                  `(?:...)`.
    #   [ ]+passed     a literal space, then the word. vitest prints
    #                  `377 passed`, never `377  passed` and never
    #                  `377green`.
    #   (?!…\|)        THE TIGHTENING THAT SURVIVED, and the reason a broadened
    #                             pattern was affordable in the first place. A run
    #                             with a skip, a todo or a failure prints the
    #                             count and then a separator before the rest of
    #                             the summary:
    #
    #                                 <6 spaces>Tests  2 passed | 1 skipped (3)
    #                                 \x1b[2m      Tests \x1b[22m …2 passed…\x1b[2m | \x1b[22m…1 skipped…
    #
    #                             The old pattern matched both of those and
    #                             read 2, or 377, off a suite that had skipped.
    #                             This one refuses any line where, after
    #                             `passed`, the next thing is a `|`. So a skip
    #                             is `gate.proof-missing` and not a smaller
    #                             green — the same rule AGENTS.md already states
    #                             for the end-to-end tier, applied to the suite.
    #
    #                             It has nothing to do with colour and it is the
    #                             half worth keeping if this pattern is ever
    #                             argued about again. Both spellings — the
    #                             coloured one above and the plain one — are
    #                             asserted in the self-test, because a
    #                             tightening that only holds on one of them is a
    #                             property of the runner.
    #
    #                             The tail after the separator is deliberately
    #                             NOT constrained. vitest appends ` (377)` and
    #                             this pattern does not care, so a future format
    #                             change in the summary's tail is not a red
    #                             gate; only the `|` is load-bearing.
    #
    # 554 is what the suite had on 2026-10-02, before the verification packet
    # raised it to 623. It is 628 today, re-measured on this tree on 2026-10-02
    # (`npm test` -> `Tests  628 passed (628)`, 26 files). The +5 is the deploy
    # packet's, and it is worth saying which five, because a floor that goes up
    # with no account of what it bought is a floor nobody trusts:
    #
    #   * 5 in `src/app/readyz/route.test.ts`, appended to the four cases that
    #     already tested the route — a probe is code, not config, and these are
    #     the assertions that read `config/deploy.yml` and check the path its
    #     healthcheck gates the rollout on is a path THIS APP SERVES. Nothing
    #     upstream can see that: measured on kamal 2.12.0 while writing the file,
    #     `kamal config` exits 0 with `path: /up` and kamal's own
    #     `Kamal::Configuration::Proxy` validator accepts it too. Broken to `/up`,
    #     three of the five go red; broken to `/healthz`, two of them do.
    #
    # The rest of the history, for the record: 484 was the count on 2026-10-01,
    # and the password-reset packet took it to 554 by adding 70:
    #
    #   * 20 in `src/app/forgot-password/page.test.tsx` — the enumeration
    #     property from both sides, the 503 sentence, the 422 on the address
    #     field, the double-submit guard, and the "the form goes away on success"
    #     rule that identity's one-minute cooldown makes load-bearing;
    #   * 18 in `src/app/reset-password/page.test.tsx` — the token in the URL, the
    #     single-use double-submit, the 404 that must never say "expired", the
    #     missing-token state, the 422, the 503, and the network failure;
    #   * 11 in `src/lib/identity.test.ts` — the two recovery calls' request
    #     shapes, the constant 202 body, the no-bearer-token rule on both, the
    #     404, the 422, the 503;
    #   * 17 in `src/lib/credentials.test.ts`, a file that packet created. It
    #     covers the registration and sign-in rules that were previously only
    #     reached through the forms, plus the two new validators. The file is new
    #     because the password floor now applies in one place and NOT the other,
    #     and that difference is worth a test table of its own rather than four
    #     assertions buried in two screen suites;
    #   * 4 in `src/app/login/page.test.tsx` — the "Forgot your password?"
    #     affordance and the changed-password arrival.
    #
    # It is 662 today, raised by the BFF packet: 628 -> 662, a +34 in two new
    # files. Worth saying which, for the same reason as the +5 above — a floor
    # that goes up with no account of what it bought is a floor nobody trusts:
    #
    #   * 31 in `src/lib/upstream.test.ts`, which is the security argument for
    #     the whole packet: the destination cannot be chosen by the caller (Host,
    #     X-Forwarded-Host, `?url=`, an absolute URL in a segment), the allow-list
    #     refuses identity's other eight routes before an address is contacted, a
    #     wildcard segment is value-matched so traversal is inexpressible, the
    #     cookie's `__Host-` attributes survive byte for byte with no `Domain`
    #     added, two `Set-Cookie` headers stay two, no `Access-Control-*` is ever
    #     emitted, a 401 and a 422 pass through rather than becoming a 200, a
    #     transport failure names no address, and the body ceiling refuses before
    #     the read. Four of these were proved able to fail — see the red proofs
    #     recorded in `upstream.ts`'s header — because a check that has only ever
    #     been green has verified nothing;
    #   * 1 in `src/app/v1/[...path]/route.test.ts` for the handler's own
    #     contract, plus the two build-level bundle assertions that search the
    #     BUILT client chunks in `dist/client/assets` — the only place in this
    #     repository that can see what the build emits, and what asserts that no
    #     `NEXT_PUBLIC_` name and no upstream hostname reaches a client chunk.
    #
    # NOTHING IN THIS FILE SKIPS, and that is not an accident. The two
    # build-level cases in `route.test.ts` were first written to run only when
    # a framework's build output already existed, and this floor is what caught
    # it: with two skips, vitest prints `Tests  662 passed | 2 skipped (664)`,
    # and the `suite` proof's negative lookahead — `[ ]+passed(?![ ]*\|)` — refuses exactly that
    # line. The gate reported `gate.proof-missing` and was RIGHT to: a check that
    # silently does not run on a fresh clone is a check that has verified nothing
    # on that machine. The fix was to make the build unconditional rather than to
    # loosen the pattern, and the cost is one build on a run that did not need it.
    #
    # That history repeated itself once more, one framework later, which is why
    # the sentence above is phrased the way it is. The migration moved those two
    # assertions from the old build output to `dist/client/assets`, and they run —
    # but the suite had been reporting them as SKIPPED, because the `beforeAll`
    # that builds and reads the directory threw before either assertion was
    # reached. A search of a directory no build produces finds nothing and passes;
    # a search of a directory the build stopped producing SKIPS. Neither is a
    # green, and both pass the same eyeball.
    #
    # That is the rule this repository already had, meeting a packet that tried to
    # route around it. The `\|` is not a formatting detail in the summary line; it
    # is the gate asking whether anything was quietly not run.
    #
    # What this packet did NOT add, on purpose: nothing about TLS, multi-host
    # rolling deploys or a CDN. Those are decisions rather than tests, and a test
    # that asserts a decision is a test that outlives the decision.
    #
    # A floor is a decrease-detector and not a budget: a suite that quietly lost
    # forty tests cannot report itself as passing. It is the only place in
    # parlor that writes down how many tests there are, which is deliberate —
    # there is no ratchet test here forcing it to stay in step (see the report:
    # core has `test_the_gate_floor_is_not_below_the_suite_core_claims_to_have`,
    # and parlor has no equivalent, so raising this number when the suite grows
    # is a thing a human has to remember until MD12's machinery lands).
    #
    # IT IS 781 TODAY, AND THIS IS THE FIRST TIME THIS FLOOR HAS MOVED DOWN,
    # which is why it gets more of an account than an increase would. 798 -> 781,
    # a decrease of seventeen, and every one of the seventeen is in one deleted
    # file: `server/adapter.test.mjs`.
    #
    # WHY THE DECREASE IS CORRECT RATHER THAN A LOSS. That file tested
    # `server/adapter.mjs`, the hand-rolled Node-to-Web adapter that bound the
    # built fetch handler to a socket and served the built client assets. This
    # repository moved its default deploy to Cloudflare Workers and deleted the
    # adapter along with `server/index.mjs`, because Cloudflare supplies the
    # server and the Node target now uses `nitro`, which has one. Every one of
    # the seventeen asserted behaviour of a module this tree no longer has, and a
    # test for a deleted module is not a floor to defend — it is a test that
    # would have to be deleted anyway, one gate failure later, in a hurry.
    #
    # WHAT THE SEVENTEEN WERE, because a floor nobody can reconcile with the
    # summary line is a floor nobody is reading — the same reason the 665-vs-662
    # gap is recorded further down. Two cookies arriving as two `Set-Cookie`
    # headers rather than one joined with ", "; a streamed POST body needing
    # `duplex: "half"` or `new Request` throws on every sign-in; a `..`-bearing
    # path refused at the filesystem boundary; a throwing handler answering 500
    # rather than killing the process; and the built client assets being served
    # at all — `/assets/*`, which the built fetch handler answers 404 for, which
    # is a page that renders, a green `/healthz`, and a sign-in form that submits
    # into nothing.
    #
    # WHAT REPLACED THEM, WHICH IS NOT ONE-FOR-ONE, and that is the honest cost
    # of this packet rather than a rounding detail. Nothing now asserts those
    # five properties of the Node target, because `nitro` is not this
    # repository's code and its behaviour is its own to test. The replacement is
    # coverage at a different level: `.github/workflows/ci.yml` asserts that
    # `.output/server/index.mjs` exists and that `.output/public` carries the
    # webfont binaries — which is the failure this repository has actually
    # produced, twice. So this is a GAP and not a trade, named here so that the
    # next reader counting seventeen fewer tests knows exactly what is no longer
    # being checked rather than finding out from a bug.
    #
    # It is 798 by the next account. 755 -> 798, a +43 in three new files, and
    # every one of those tests is here because the failure it guards is invisible
    # in a rendered string.
    #
    #   * 22 in `src/components/social/social-callback-screen.test.tsx`, on the
    #     four answers `completeSocialLogin` can return plus the refusals. The
    #     risk on that screen is reading the wrong one of three mutually
    #     exclusive bodies: a LINK body read as a session, or a 202 MFA challenge
    #     read as a success, is how a client claims a session nobody minted. Each
    #     is asserted by what the screen does NOT do -- no token written, no
    #     navigation -- as much as by its copy. One test exists only for the
    #     exchange happening EXACTLY ONCE, asserted on the CALL COUNT rather than
    #     on the result, because a screen that exchanged twice and rendered the
    #     first answer correctly looks identical to one that exchanged once.
    #   * 10 in `src/routes/v1/auth/oauth/$provider/callback.test.ts`, on the route
    #     that took the callback away from the forwarder. The one that matters: a
    #     document navigation is NOT forwarded, asserted on the returned value
    #     rather than on a spy -- `createUpstreamForwarder` resolves its `fetch`
    #     ONCE at construction, so a later `globalThis.fetch = ...` is invisible to
    #     it and the first version of that assertion passed against a handler that
    #     forwarded on every request. A page whose own navigation reached identity
    #     and then fetched the same URL spends a one-shot authorization code twice
    #     and reports it as a sign-in that did not work. The other half walks the
    #     round trip through the forwarder and asserts the callback presents the
    #     cookie the START leg set -- the leg nobody remembers -- and that the
    #     path `src/lib/social.ts` builds is one the table serves, with the
    #     segments DERIVED from that path so the two files can actually disagree.
    #   * 11 in `src/components/social/social-provider-buttons.test.tsx`, run
    #     against BOTH screens so a control that moved between them goes red. One
    #     is a guard on the provider list not being empty: the buttons render as
    #     nothing when it is, and every other assertion in the file would pass
    #     vacuously.
    #
    #     The red proofs for this packet were run before the floor moved, and one of
    #     the tests had to be REWRITTEN first: deleting the `exchanged` latch left
    #     "exchanges the code exactly once" green, because it asserted after the
    #     answer had arrived and the `landing.kind !== "working"` guard was doing
    #     the work alone. It now holds the request open, which is the window the
    #     latch exists for. Four named red proofs in all -- forwarding the
    #     document branch (two tests), forwarding the programmatic branch,
    #     deleting the latch, and misspelling the last segment of the callback
    #     path in `src/lib/social.ts`.
    #
    # The floor before that, 755, was this: 727 -> 755, a +28 in two files, and
    # both halves of the count are there because this is the only place in parlor
    # that writes down how many tests there are.
    #
    #   * 16 in `src/lib/upstream.test.ts`, on the social-login surface. The
    #     packet's whole risk is a redirect and a cookie, and neither of those is
    #     visible in a hop assertion: a forwarder can forward the request
    #     perfectly and hand the browser a 302 with no `Location`, which looks
    #     like a working sign-in until a person presses the button and lands on a
    #     blank page. So the section asserts on the headers crossing BACK. The
    #     three that matter are the start leg's 302 carrying both `Location` and
    #     `Set-Cookie`, a 302 on a route that did NOT declare itself a redirect
    #     arriving with no `Location`, and both legs of a round trip walked
    #     through the forwarder to assert that the state cookie identity SET on
    #     leg one is the cookie identity RECEIVES on leg two. The other thirteen
    #     are the allow-list's ordinary properties applied to the two new routes:
    #     the provider segment value-matched rather than wildcarded, a forged
    #     provider refused on both routes before an address is contacted, the
    #     callback's `code`/`state`/`error` surviving and an undeclared
    #     `redirect_uri` being dropped, a wrong verb refused with no hop, and no
    #     credential invented on a `security: []` route.
    #   * 12 in `src/lib/identity.test.ts`, on the two client methods. They are
    #     the only two in this file whose answer is not a body read out of a 2xx,
    #     so `send`'s contract is wrong for both and each writes its own status
    #     handling out. The cases are the ones a lazy reader gets wrong: a 302 is
    #     a success and not a malformed answer, a 302 with no `Location` is a
    #     failure rather than an empty string, a 2xx on a redirect operation is a
    #     contract violation, `{}` is a failure for BOTH methods, and the link
    #     body — which has `linked_provider` and no `token` at all — must never
    #     become a session with an empty token.
    #
    # ALL THREE of the forwarder's redirect tests were proved able to fail before
    # that floor moved: dropping the route's `browserRedirect` mark, putting
    # `location` back on the global allow-list, and conditioning the `Set-Cookie`
    # relay on a 2xx each turned named tests red. The third is the one worth
    # naming here, because it is the failure that passes every test written
    # against the callback leg and fails in the browser at the first real sign-in.
    #
    # It is 727 by the next account. 710 -> 727, a +17, all of them in
    # `server/adapter.test.mjs` — the Node-to-Web adapter that binds the built
    # fetch handler to a socket and serves the built client assets. Both of those
    # are things the built server does not do: it exports `{ fetch(request) }` and
    # answers 404 for `/assets/*`, which is a page that renders, a green
    # `/healthz` and a sign-in form that submits into nothing.
    #
    # It is also the one file in the tree where a byte is translated between two
    # runtimes, so every property that fails silently is asserted directly: two
    # cookies arriving as two `Set-Cookie` headers rather than one joined by
    # ", ", a streamed POST body needing `duplex: "half"` or `new Request` throws
    # on every sign-in, a `..`-bearing path refused at the filesystem boundary,
    # and a throwing handler answering 500 rather than killing the process.
    #
    # The floor before that, 710, was raised by the tenant-proof packet:
    # 665 -> 710, a +45 in two files and for one reason. `DEBT.md` D18 measured this repository at
    # zero cross-tenant negative tests, and that was true: there was nothing in
    # the suite asserting that one account's rows are not another account's.
    # The number moved because the account boundary is now written down in two
    # places, and both are load-bearing rather than documentation:
    #
    #   * 12 in `src/lib/accounts.test.tsx`, on the account cache. This is the
    #     only store of account-scoped rows in this process — `parlor` has no
    #     database — so it is where a cross-tenant read can happen with every
    #     request to `identity` still correct. The arms: two accounts in one
    #     session (the `:accountId` half of a cache key), two sessions in one
    #     account (the `token` half), the member panel, and the account list,
    #     which is scoped by the token alone. Each asserts the REFUSAL reaches
