# THIS FILE IS NOT A GITHUB ACTIONS WORKFLOW ANY MORE, AND NOTHING RUNS IT.
#
# The fleet's CI runs in dev sandboxes: the same sandbox the work happens in,
# on the machine the developer chose. This file is the SPECIFICATION those
# checks read — the steps, the floors, the exemptions — kept where the
# repository can hold it and read it.
#
# What executes is `ci/the pipeline` (named in this repository's `gate.yml`, under
# `ci.workflow`), and the CI service reads that declaration and runs it.
#
# The GitHub Actions spelling is retired, not deleted, because the checks in
# this repository read this file to hold the specification still: a gate that
# checks a specification nobody executes is a gate checking a fiction, and a
# gate that checks nothing is worse. The steps below are the specification
# the executable CI is measured against, and the day this file stops being
# that, the checks move with it.
---
# parlor CI — the shared half is kit's, the service-specific half is here.
#
# The shared workflow is called, not copied: a fix in
# cafaye/kit/ci/ci.reusable.yml reaches this repository on the
# next run with no per-repo PR. The `.github/workflows/` in that path is not
# decoration — GitHub resolves a reusable workflow at
# `{owner}/{repo}/ci/{file}@{ref}` and documents that
# subdirectories of the workflows directory are unsupported, so the older
# `cafaye/kit/workflows/ci.reusable.yml@master` resolves to nothing.
#
# Three jobs, and the split is the point:
#
#   ci     kit's `node` job: the shared contract. Frozen install, lint, test,
#          plus the coverage step (see the note on why coverage is 0 here).
#   prime  THIS repository's gate — literally `./bin/prime`, the same command a
#          developer runs — and the lockfile guard.
#   build  `tsc --noEmit` on a tree with no generated types, then `npm run build`,
#          then an assertion that the output the Dockerfile ships was produced.
#
# Why prime and build cannot live in kit's workflow, and are not copies of it:
# kit owns what every service does the same way. It cannot own which command
# this repository's own gate is, nor that this repository's build depends on two
# build-time `NEXT_PUBLIC_*` values, nor that its typecheck must run before a
# build has generated anything for it. Reaching into a service's script layout
# or its env contract is exactly the step kit is not allowed to have: it would
# be kit knowing about parlor, and the next service would fork the file.
name: ci

on: [push, pull_request]

permissions:
  contents: read

# Same rule kit's own workflow uses: a second push to a branch makes the first
# one's answer irrelevant, so it is cancelled rather than waited out.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------- the shared
  ci:
    name: ci (kit, node)
    uses: cafaye/kit/ci/ci.reusable.yml@master
    with:
      # `node`, not `bun`: the committed lockfile is package-lock.json, and the
      # bun job installs frozen from bun.lock. The value follows the lockfile
      # in the tree, and `tests/validate-ci.sh` fails if the two disagree.
      language: node
      working-dir: .
      # JSON toolchain pin, handed to kit's `actions/setup-node`. The value is
      # the pin of record from package.json's `engines.node`; the workflow
      # cannot read a JSON field through kit's inputs, so the number is
      # restated here and `tests/validate-ci.sh` fails when the restatement
      # drifts. The two companion jobs below do not restate it: they pass
      # `node-version-file: package.json`, which setup-node resolves from
      # `engines.node` directly.
      versions: '{"node":"22.22.2"}'
      # Deliberately not set. kit defaults this to 0 so adoption never blocks a
      # repo on day one, and a gate left at 0 fails nothing. Raising it needs a
      # coverage command — `npm run coverage` — and coverage needs
      # @vitest/coverage-v8, which is a new dependency and therefore a manager
      # decision (PLAN.md §5). Until that lands, the honest state is 0 and this
      # comment, not a threshold that pretends to be measured. See the report.

  # -------------------------------------------------- the gate, and its guard
  prime:
    name: bin/prime
    runs-on: ubuntu-latest
    # 15, and not GitHub's 360-minute default: a hung job burns billing hours.
    # npm ci plus the vitest gate is minutes, so 15 is a ceiling a healthy run
    # never reaches.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Read out of the repository rather than written here, so the pin
          # exists in exactly one file for the jobs this repository owns.
          # setup-node looks in `volta.node`, then `devEngines.runtime`, then
          # `engines.node`; parlor has only the last.
          node-version-file: package.json
      - name: the gate a developer runs
        # One line, the ordinary spelling. Nothing about this job is about YAML.
        # `tests/gate-declaration-self-test.sh` asserts the checker sees this
        # step's invocation and goes red the moment it stops calling the
        # declared argv, so the redundancy is guarded rather than merely
        # claimed.
        run: ./bin/prime
      # `npm ci` cannot move this file — it exits nonzero instead, which is the
      # point: a lockfile that disagrees with package.json should stop the
      # build, not be quietly rewritten. This step covers the other direction,
      # where something later in the job writes a resolution into the tree and
      # the run would otherwise go green having changed the thing the next
      # `npm ci` depends on. `--` so a filename can never be read as a revision.
      - name: the gate leaves package-lock.json alone
        run: git diff --exit-code -- package-lock.json

  # ----------------------------------------------- typecheck, then the build
  # One job, two checks, in this order and the order is the assertion.
  #
  # `typecheck` runs first, on a tree where `rm -rf dist` has just happened, so
  # it cannot pass on anything a build generated. Layout props are typed
  # explicitly rather than with a framework-generated type precisely so that a
  # fresh clone typechecks — a typecheck that needs a prior build is a typecheck
  # that has not been run on a clean checkout by anyone.
  #
  # `build` runs second because nothing else in CI runs it. vitest renders
  # components in jsdom, so a route that does not compile, an import that only
  # resolves on one side of the client/server split, or a prerender that throws
  # is invisible to the test suite. The suite passing is not a claim that this
  # repository builds.
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    # 20, and not GitHub's 360-minute default: typecheck plus two full builds
    # (worker and node) — the slowest job in this file, still minutes.
    timeout-minutes: 20
    env:
      # The BFF means the client bundle contains no service address, so a build
      # needs none of these. They are declared anyway, to `.invalid` names, for
      # one reason: `src/app/v1/[...path]/route.test.ts` walks the SOURCE tree
      # refusing any module that names `NEXT_PUBLIC_*`, and a job that set none
      # would not prove the build is the one the Dockerfile runs — it would prove
      # it is a build with the variables absent, which is a different question.
      # RFC 2606 reserves `.invalid` for a name that must never resolve, so a
      # build that somehow reached for one fails loudly instead of quietly
      # phoning home.
      NEXT_PUBLIC_IDENTITY_URL: https://identity.invalid
      NEXT_PUBLIC_BILLING_URL: https://billing.invalid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: install the committed lockfile
        run: npm ci
      - name: typecheck without generated types
        run: |
          rm -rf dist
          npm run typecheck
      - name: build
        run: npm run build
      # The Dockerfile copies `.output/` and runs `node .output/server/index.mjs`.
      # A build that exits 0 without producing them is a green job over a broken
      # image, and this is not belt-and-braces on the build's exit code: `vite
      # build` does not fail because the font binaries were never copied, and it
      # does not fail when a route fails to prerender.
      #
      # BOTH TARGETS ARE ASSERTED, because this repository now builds two and a
      # check that names only one is a check that cannot notice the other
      # regressing:
      #
      #   * `npm run build` (the `build` step above) emits the CLOUDFLARE WORKER.
      #     `dist/server/index.mjs` is the Worker module — it replaced
      #     `dist/server/server.mjs` when the `cloudflare()` plugin took over the
      #     `ssr` environment — and `dist/server/wrangler.json` is the plugin's own
      #     generated config, whose `main` is that file. Asserting the module
      #     without the config would accept a tree where the Worker cannot be
      #     bundled.
      #   * `npm run build:node` (below) emits the NODE SERVER the Dockerfile
      #     ships. `.output/server/index.mjs` is what the CMD runs; a Node build
      #     that emits everything else is a container that exits 0 and answers
      #     nothing.
      #
      # The webfont binaries are asserted by CONTENT rather than by the build log,
      # and in BOTH outputs, because the two builds put them in different
      # directories and getting that wrong is invisible in a rendered string: the
      # log prints a warning and exits 0, and a stylesheet whose `@font-face`
      # blocks name 118 files that are not there is an app that renders, answers
      # every route and cannot be read. This is not hypothetical — the Node build
      # shipped exactly that once already, because Nitro populates `.output/public`
      # before the copy hook runs. See `copyFontFiles` in `vite.config.mts`.
      - name: the output the Dockerfile ships exists
        run: |
          set -euo pipefail
          for artefact in dist/server/index.mjs dist/server/wrangler.json dist/client/assets; do
            if [ ! -e "$artefact" ]; then
              echo "::error::$artefact is missing; it is the Cloudflare Worker's build output" >&2
              exit 1
            fi
          done
          if [ -z "$(find dist/client -name '*.woff2' -print -quit)" ]; then
            echo "::error::no webfont binaries under dist/client; the emitted stylesheet names them" >&2
            exit 1
          fi
          echo "cloudflare worker build output present"
      - name: the node build the Dockerfile runs
        run: npm run build:node
      - name: the output the Dockerfile runs exists
        run: |
          set -euo pipefail
          if [ ! -e .output/server/index.mjs ]; then
            echo "::error::.output/server/index.mjs is missing; the Dockerfile's CMD runs it" >&2
            exit 1
          fi
          # Same class of failure as the Cloudflare half above, and the reason it
          # is asserted against `.output/public` rather than `dist/client`: the
          # Node target serves from `.output/public`, so fonts sitting in
          # `dist/client/assets/files/` are fonts nothing will ever be asked for.
          if [ -z "$(find .output/public -name '*.woff2' -print -quit)" ]; then
            echo "::error::no webfont binaries under .output/public; the served stylesheet names them" >&2
            exit 1
          fi
          echo "node build output present"
