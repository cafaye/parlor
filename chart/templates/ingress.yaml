# Code generated by `caf gen chart`. DO NOT EDIT.
#
# The Ingress: how the service is reached from outside the cluster.
# Off by default and gated on `ingress.enabled` in values.yaml — see
# that file for why it is off, and for the issuer the chart names
# and never creates.
{{- if .Values.ingress.enabled }}
{{- $hosts := .Values.ingress.hosts }}
{{- if not $hosts }}
{{- if .Values.ingress.host }}
{{- $hosts = list .Values.ingress.host }}
{{- end }}
{{- end }}
{{- if not $hosts }}
{{- fail "caf gen chart: ingress.enabled is true and ingress.hosts is empty (and ingress.host is empty) — an Ingress with no host is a silent misroute; set ingress.hosts in values.yaml" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parlor
  labels:
    app.kubernetes.io/name: parlor
    app.kubernetes.io/instance: parlor
    app.kubernetes.io/managed-by: caf
  {{- if .Values.ingress.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
  {{- end }}

spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if and .Values.ingress.tls .Values.ingress.clusterIssuer }}
  tls:
  {{- range $host := $hosts }}
    - hosts:
        - {{ $host }}
      secretName: parlor-tls-{{ $host | replace "." "-" }}
  {{- end }}
  {{- end }}
  rules:
  {{- range $host := $hosts }}
    - host: {{ $host }}
      http:
        paths:
          - path: {{ $.Values.ingress.path }}
            pathType: {{ $.Values.ingress.pathType }}
            backend:
              service:
                name: parlor
                port:
                  number: {{ $.Values.service.port }}
  {{- end }}
{{- end }}
