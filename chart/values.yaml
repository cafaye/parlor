# Generated by `caf gen chart` from this project's anywaye.yml.
#
# This is the chart's DEPLOYMENT-TIME half, and it is the one file in the
# chart meant to be edited: the values commit is the write path of the
# pull-based loop (DEPLOYMENT.md — "a values commit, then wait for
# sync"), and this is the file that commit edits. The templates are the
# contract and are not. Re-running `caf gen chart` refuses to overwrite
# this file without -force, so an edit is never lost to an accident.
#
# The defaults below are derived from the manifest where the manifest
# carries the fact, and stated here where it does not.

# The image the service runs.
#
# The repository is the fleet's private OCI registry (GHCR), because the
# substrate is closed source and a pull-based system needs somewhere to
# pull from. The tag is a VALUE and is never `latest`: a floating tag
# is a deploy that changes when somebody else pushes, and the loop
# exists so that what runs is exactly what the values commit said.
# Set it at release time; the default is the chart's own version.
image:
  repository: ghcr.io/anywaye/parlor
  tag: "0.1.0"
  # The digest of the image this chart names — the ONE image name that cannot
  # move, and the half a tag-pinned chart was missing.
  #
  # WHAT WRITES IT: the publish workflow, on a `push: true` run, from the image
  # job's build output (`needs.image.outputs.digest`), handed down by
  # `publish.reusable.yml` — the only party that knows both the image and the
  # chart — and written into this file by `chart.reusable.yml`'s `pin the image
  # by digest` step BEFORE `helm package`. It is derived, never typed, and the
  # step REFUSES anything that is not `sha256:<64 lowercase hex>` so a digest a
  # human pasted cannot become a chart.
  #
  # WHY IT EXISTS: the tag above is MUTABLE — the image job republishes `0.1.0`
  # on every push to master — so a chart that pinned the image by tag rendered a
  # Deployment that was textually IDENTICAL before and after a build. Argo's
  # diff reported `Synced`, rolled nothing, and `imagePullPolicy: IfNotPresent`
  # re-served the node's stale copy on every restart. Measured
  # (`roll-c5-image-digest`, gateway): the registry's `ghcr.io/anywaye/gateway:
  # 0.1.0` held `sha256:c264…37165` while the node ran `sha256:8e60…e79b`, six
  # hours after the fix was merged and published. A DIGEST cannot move, so a new
  # build is a textual diff Argo ROLLS — the whole point of this field.
  #
  # THE TEMPLATE renders `repository@digest` when this is set and falls back to
  # `repository:tag` when it is empty, so a chart that has not adopted the field
  # still renders. THIS COMMITTED VALUE IS WHAT A FRESH CLONE RENDERS: the
  # publish step REPLACES it on every `push: true` run, and packages the chart
  # as committed when the digest input is empty (a `push: false` run, or a chart
  # the composer could not hand a digest). It is the digest of this repository's
  # current published image, read from the registry.
  digest: "sha256:a5b4db5b8c6d93ce508315767d98ab40bb6dd8818a23edcc8e94eba284333e66"
  pullPolicy: IfNotPresent

# The read-only pull secret on the box, created once, out of band:
#
#   kubectl create secret docker-registry parlor-ghcr \
#     --docker-server=ghcr.io \
#     --docker-username=<deploy-bot> \
#     --docker-password=<read-only-token>
#
# The chart NAMES the secret and never contains a credential. A
# credential that reaches this file is a credential in a git
# repository, which is the one thing the pull-based loop exists to
# prevent.
imagePullSecrets: parlor-ghcr

# The secret holding the service's environment, also created on the box
# and also by name only. The Deployment reads it with envFrom, so a
# value is rotated by replacing the secret and restarting the pods —
# not by editing a generated file.
secretName: parlor-secrets

# How many copies of the service run. One is the default for a service
# whose state is the cluster's, not the pod's; raise it when the
# service scales horizontally.
replicas: 1

# The Service in front of the container.
service:
  type: ClusterIP
  port: 80

# How the service is reached from outside the cluster: an Ingress,
# gated on `ingress.enabled`.
#
# A chart that suddenly routes traffic is a defect: the substrate's
# first sync happens before any operator has set a host, and an
# Ingress with no host is a silent misroute — the class of defect
# kit's /up healthcheck was. The services the fleet exposes (gateway,
# parlor) turn the knob on in their values commit; identity and
# courier stay internal. **parlor's values commit turns it on**:
# parlor is the app shell at `app.anywaye.com` — the host the fleet's
# own fixtures name (`billing/test/fixtures/stripe/checkout.session.
# completed*.json` carries `https://app.anywaye.com/welcome`) — and
# that is its ONE host.
#
# The apex (`anywaye.com`) and `www.anywaye.com` belong to
# `anywaye/website`: the marketing landing, `/box`, and the
# `/box/install` front door (`curl -fsSL https://anywaye.com/box/
# install | bash`). The website deploys to the cluster with exactly
# those two hosts and certs already issued. Two Ingresses claiming
# one host is a silent misroute — Traefik picks one and nobody knows
# which — so parlor must not claim them. Parlor held them briefly in
# `28b3156` as a stopgap while the apex had no server; that stopgap
# is now reverted.
#
# The template's multi-host shape (`hosts` list, one TLS secret per
# host) stays: it is correct, and the website uses the same shape.
# Only the values change.
#
# The edge is Traefik, k3s's default ingress controller, with
# cert-manager in front of it (DEPLOYMENT.md:28 — "Ingress + TLS |
# Traefik (k3s default) + cert-manager | declarative, no edge
# box"). The ClusterIssuer is created ONCE PER CLUSTER by the
# substrate (a follow-up, not this packet); this block only NAMES
# it — the same "names the secret and never contains a credential"
# discipline the imagePullSecrets block uses. Empty means no TLS: a
# secret nothing writes.
ingress:
  enabled: true
  className: traefik
  hosts:
    - app.anywaye.com
  # `host` (singular) is the legacy spelling — kept for back-compat so
  # an existing values file with `host: app.anywaye.com` and no `hosts`
  # still renders a single-host Ingress. When `hosts` is non-empty it
  # takes precedence and `host` is ignored; the template falls back to
  # `host` only when `hosts` is absent or empty, then fails if both are
  # empty. New deploys should set `hosts`; `host` remains as a
  # deprecated alias and will be removed when no tracked values file
  # uses it.
  host: app.anywaye.com
  clusterIssuer: letsencrypt-prod
  tls: true
  path: /
  pathType: Prefix

# The service's environment, as NAME: value pairs.
#
# The manifest carries no env — a service's configuration is its own,
# and caf will not guess it — so this starts empty and is filled per
# deployment, or at generation time with repeated -env flags:
#
#   caf gen chart -env DATABASE_URL=... -env API_KEY=...
env: {}

# What the container is allowed to ask for and keep. Requests are what
# the scheduler places the pod on the basis of; limits are what it is
# killed at. These are starting points for a small service on a shared
# box, not a measurement — adjust them to the service's real footprint.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# The readiness probe's timing. The PATH is not here: it is /readyz,
# the fleet's contract, baked into the template — see the chart README
# for why a readiness path that can be edited is a defect waiting.
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

# The namespace the service lands in. One service per namespace, so the
# namespace is the unit Argo syncs and the unit a rollback reverts.
namespace: parlor
