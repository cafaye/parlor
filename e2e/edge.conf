# The same-origin edge for the end-to-end stack.
#
# WHY THIS FILE EXISTS — and it is now much smaller than it was
# ------------------------------------------------------------------
# It exists because the stack needs ONE origin, and Compose cannot give a browser
# one. identity and parlor are two containers on one network; a browser cannot
# call `identity` by the name `identity`, and identity serves no CORS headers, so
# a page served from `parlor` cannot read an answer from `identity` at all.
# nginx here is the piece that gives the browser a single address to talk to.
#
# WHAT CHANGED, AND IT IS THE WHOLE OF THIS PACKET
#   Before, the browser's traffic went to the EDGE and nginx moved it:
#
#       location /v1/ { proxy_pass http://identity; }
#
#   That was a workaround for a product defect. `src/lib/identity.ts` fetched
#   from the browser at `NEXT_PUBLIC_IDENTITY_URL`, a `next build`-inlined
#   constant, so the caller of identity was a person on parlor's origin. A deploy
#   could not copy this file: kamal-proxy routes by HOSTNAME, not by path, so one
#   hostname cannot send `/v1/*` to identity and everything else to parlor. A
#   green deploy served a sign-in that could not complete.
#
#   `src/app/v1/[...path]/route.ts` is the real fix, and it is in the product.
#   The browser now calls `/v1/session` on parlor's own origin and the app
#   forwards it to identity server-side. So the routing below is ONE upstream,
#   and the whole reason this file had a second one is gone.
#
#   The `location /v1/` block was DELETED rather than left in place. Leaving it
#   would be worse than deleting it: nginx would answer `/v1/*` itself, the BFF
#   would never run, and this stack would keep passing while proving nothing
#   about the code this packet wrote. The stack is now a measurement of the
#   product, not of the harness's workaround.
#
# WHAT IT IS NOT
#   * Not a cafaye service. It has no manifest, no contract, no health surfaces
#     and no place in `caf dev`. It is harness scaffolding, exactly like the
#     fixtures in a service's own integration suite.
#   * Not the security boundary. The allow-list, the fixed destination and the
#     error handling live in `src/lib/upstream.ts` and are tested there. nginx
#     forwards bytes; it does not decide what is allowed.
#   * Still needed for the same reason as before: Compose gives the browser no
#     single origin, and that is a property of Docker, not of the product.
#
# THE ROUTING, and why it is exactly this routing
#   /healthz  -> parlor. `cafaye.yml` declares `/healthz` and `/readyz` as
#   /readyz     *parlor's* routes and says the platform contract reads them, so
#                the edge does not shadow them with identity's. Both services
#                expose both paths; the app's own must win, or an operator
#                probing the deployed origin would get somebody else's answer.
#   /         -> parlor. Including `/_next/*`, the static assets, every page, and
#                `/v1/*` — which the app answers itself.

upstream parlor {
    server parlor:3000;
}

server {
    listen 3000;

    # Anything that is not one of the two below is the app. Explicit server_name
    # omitted: the harness reaches this by an address, and a default_server
    # catch-all is the only server in the file.
    client_max_body_size 1m;

    location = /healthz {
        proxy_pass http://parlor;
        include /etc/nginx/proxy-headers.conf;
    }

    location = /readyz {
        proxy_pass http://parlor;
        include /etc/nginx/proxy-headers.conf;
    }

    # `/v1/*` is NOT here, and its absence is the assertion. The app serves it
    # from `src/app/v1/[...path]/route.ts`, which is the whole subject of this
    # packet. If a `location /v1/` block ever comes back, the stack goes on
    # passing while the BFF stops being exercised — so this comment is the only
    # thing standing between a future reader and a green test that means nothing.
    location / {
        proxy_pass http://parlor;
        include /etc/nginx/proxy-headers.conf;
    }
}
