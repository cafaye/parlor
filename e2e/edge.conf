# The same-origin edge for the end-to-end stack.
#
# WHY THIS FILE EXISTS — and it is not "to make a test pass"
# ------------------------------------------------------------------
# It exists because a browser cannot call `identity` from `parlor` today, and
# the reason is not in either repository's code:
#
#   * `parlor` calls identity from the BROWSER. `src/lib/identity.ts` reads
#     `NEXT_PUBLIC_IDENTITY_URL` and the client bundle does the fetching, so the
#     caller is the user's browser, on the app's origin.
#   * `identity` serves no CORS headers. There is no `Access-Control-Allow-*`
#     anywhere in `identity/internal/`, and `OPTIONS /v1/session` answers 405 —
#     the route implements POST, and the browser's preflight is not that.
#   * So the preflight fails, the response is unreadable, and the sign-in form
#     renders "Something went wrong. Try again."
#
# That was measured on this stack, not inferred: it is the first thing the
# end-to-end suite found, and the unit suite cannot see it because every test
# injects a stub transport and never opens a socket.
#
# AGENTS.md already names the two real fixes, and neither of them has landed:
# identity could grow a CORS policy, or parlor could grow a same-origin BFF route
# in front of identity (the packet that also moves the session token out of
# `localStorage`). This harness may not depend on either, and may not edit a
# sibling, so it supplies the second shape with a reverse proxy and says so.
# DECISION NEEDED (D1) in the packet report.
#
# WHAT IT IS NOT
#   * Not a cafaye service. It has no manifest, no contract, no health surfaces
#     and no place in `caf dev`. It is harness scaffolding, exactly like the
#     fixtures in a service's own integration suite.
#   * Not the BFF. It adds no session, mints no cookie and holds no credential.
#     It moves bytes and adds an origin. The security work in guard's BFF is
#     still guard's and is still untested by this stack.
#
# THE ROUTING, and why it is exactly this routing
#   /v1/*     -> identity. Every route identity serves is under this prefix, and
#                nothing in parlor is. This is the whole of the surface the
#                browser needs.
#   /healthz  -> parlor. `cafaye.yml` declares `/healthz` and `/readyz` as
#   /readyz     *parlor's* routes and says the platform contract reads them, so
#                the edge does not shadow them with identity's. Both services
#                expose both paths; the app's own must win, or an operator
#                probing the deployed origin would get somebody else's answer.
#   /         -> parlor. Including `/_next/*`, the static assets, and every page.
#
# THE ONE CONFIGURATION FACT THIS FILE MAKES TESTABLE
#   `NEXT_PUBLIC_IDENTITY_URL` for the parlor image is the *edge's* origin, not
#   identity's. That is the change that makes the browser's call same-origin, and
#   it is set in e2e/docker-compose.yml as a build arg because Next inlines it at
#   build time. If that arg is ever dropped or pointed at `identity:8080` — a
#   name only the compose network can resolve — the page still loads, the build
#   still succeeds, and the sign-in form renders its generic failure. The
#   end-to-end suite is the only thing in the tree that notices.

upstream parlor {
    server parlor:3000;
}

upstream identity {
    server identity:8080;
}

server {
    listen 3000;

    # Anything that is not one of the two above is the app. Explicit server_name
    # omitted: the harness reaches this by an address, and a default_server
    # catch-all is the only server in the file.
    client_max_body_size 1m;

    # identity's /v1 surface. `proxy_pass` with no URI part passes the original
    # request URI through unchanged, which is what makes `/v1/session` land on
    # identity's `/v1/session` and not on `/`.
    location /v1/ {
        proxy_pass http://identity;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # identity bounds its own bodies at 4 KiB and answers 413 for a larger
        # one; this is a matching ceiling rather than a second rule, so the
        # refusal comes from the service that owns it.
        client_max_body_size 4k;
    }

    location = /healthz {
        proxy_pass http://parlor;
        include /etc/nginx/proxy-headers.conf;
    }

    location = /readyz {
        proxy_pass http://parlor;
        include /etc/nginx/proxy-headers.conf;
    }

    location / {
        proxy_pass http://parlor;
        include /etc/nginx/proxy-headers.conf;
    }
}
