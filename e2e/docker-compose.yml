---
# The whole cafaye stack, for the end-to-end suite. This is the topology the
# Playwright specs in this directory drive; `bin/e2e` is the only thing that
# brings it up.
#
# ---------------------------------------------------------------------------
# WHERE THIS TOPOLOGY CAME FROM — read this before adding a service
# ---------------------------------------------------------------------------
# It is NOT a second copy of the platform topology. The topology is owned by two
# places three directories away, and this file is a thin overlay on both:
#
#   ../kit/templates/compose/docker-compose.yml   the local infrastructure a
#       cafaye service joins: Postgres, NATS, Redis, the OTel collector. kit
#       owns those images, their pins and their healthchecks, and the pins
#       there are exact tags. Nothing in this file restates a kit image except
#       where the harness needs a different one and says so.
#
#   ../caf — `caf dev` renders a compose document from a manifest plus a
#       service catalog (internal/dev/plan.go, internal/dev/registry.go). It
#       plans the *shape*: the project service built from the working tree, its
#       declared dependencies resolved through the registry, the local Postgres
#       and Redis, healthcheck-ordered `depends_on`, and a port-conflict refusal.
#       This file is that plan with three things it cannot express, listed
#       below. The alternative — invoking `caf dev` and then hand-patching its
#       output — was rejected, and the reason is in the report: `caf dev`
#       resolves dependencies to *published images*, and this harness has to
#       consume siblings by tag rather than rebuild them, and it has to pin a
#       port block nothing else on the machine uses.
#
# The three differences from what `caf dev` would render, and why each is here
# rather than a caf feature request:
#
#   1. NO SIBLING BUILD CONTEXTS — this file changed, and the change is the
#      point of the whole contract below. `caf dev` builds the project service
#      and pulls its dependencies; so does this file, for `parlor`. But
#      `identity` and `guard` carry an `image:` and NO `build:`, so this tier
#      consumes them as published artifacts rather than rebuilding them from
#      `../identity` and `../guard` on every run.
#
#      WHY, because "it is faster" is not the reason and the measured numbers
#      say so: a warm full build here is 13.81s and invalidating identity costs
#      20.40s (logs/parlor-registry-e2e-01/README.md, measured). The old
#      `build:` stanzas did not cost minutes. What they cost was that
#      `cafaye/e2e-identity:local` was built from whatever happened to be in
#      the sibling checkout at the instant the suite ran, pushed nowhere, and
#      nameable by nothing outside that docker daemon — so the verification
#      tier could not be shown to test the artifact the fleet deploys, because
#      it tested a different one by construction. "Build once, deploy once, use
#      everywhere" is only true if the verification tier consumes the same
#      artifact, and this is the file that decides whether it does.
#
#      The escape hatch is explicit and off by default: `E2E_BUILD_SIBLINGS=1`
#      layers e2e/docker-compose.siblings.yml, which puts the `build:` stanzas
#      back, for a developer whose sibling change is not merged yet. One
#      documented path, not two defaults.
#   2. A port block nothing else uses. See PORTS below.
#   3. A migration step. Migrations are a deploy step in every service, by
#      policy, so nothing here migrates on boot. `bin/e2e` runs `goose` from the
#      host, which is identity's own documented dev procedure
#      (`../identity/migrations/README.md`, "Running migrations") and is why this
#      file has no goose image: a third-party migration image pinned into the
#      fleet's toolchain is a decision that belongs to identity and the manager,
#      not to a test harness. See DECISION NEEDED in the packet report.
#
# ---------------------------------------------------------------------------
# PORTS — the 16xxx block, and why
# ---------------------------------------------------------------------------
# Everything published here lands in 16000-16099. The choice is the only free
# decision in this file, so here is the whole reasoning:
#
#   * Not the standard ports. 3000, 8080, 5432 and 6379 are exactly the ports a
#     developer's own `caf dev` stack, a local Postgres and a local Redis are
#     already on. The brief for this file is that a developer's running stack
#     must survive the harness.
#   * Not 15xxx. That block is this workspace's observability stack
#     (cafaye-grafana 15000, postgres 15500, nats 15600/15700, redis 15800,
#     tempo 15900, loki 15901, mimir 15902) and it is *running* right now on
#     the machine this was written on. Two stacks that both believe they own
#     15xxx is a collision the day somebody scales either of them.
#   * 16xxx is adjacent, unallocated, and still a block: 100 ports for a
#     six-service fleet, and 16000-16099 leaves room for the services this file
#     does not have yet (billing, courier, darkroom, muse) without moving
#     anything.
#   * The layout is by role, not by service, so a reader can guess a port:
#       16000      the origin a browser talks to (the edge)
#       16001-99   everything else, one port each, in service-name order
#   * `parlor` is published on 16003 AND proxied through the edge, rather than
#     only proxied. The harness proves the app is up as a process and that the
#     edge can reach it, and those are two facts that fail for two reasons.
#
# Every published port is `${E2E_*:default}`: a literal port in a compose file
# is a collision the second developer on the machine hits. Change it in the
# environment, not here. The container-side ports are not parameterized —
# those are fixed by the images and by the service contracts.
#
# ---------------------------------------------------------------------------
# READINESS — no sleeps, and the reason is in this file
# ---------------------------------------------------------------------------
# Every service here has a healthcheck, and every one of them probes a
# `/readyz` or its equivalent rather than a port. `docker compose up --wait`
# blocks on those health states, and `bin/e2e` additionally polls the published
# `/readyz` from the host, because a container that is healthy is a claim made
# from inside the network and the browser is not inside the network.
#
# A service with no `/readyz` would be a finding to report, not a reason to
# sleep. All three application services here have one: identity (`/readyz`,
# which pings its database), guard (`/readyz`, which reports `identity` and
# `redis` by name), and parlor (`/readyz`, currently reporting
# `"deps":"none"` — see AGENTS.md, "Health surfaces").
#
# The edge has no `/readyz` of its own and that is deliberate: it is a proxy, it
# does not implement the platform's health contract, and giving it one would be a
# second answer to a question the contract already has. Its healthcheck asks the
# *app's* liveness through the proxy, which is the only question it can answer.
#
# parlor's `/readyz` NOT probing identity is deliberate and is why the E2E
# spec asserts the user-visible result instead: a stack that comes up and then
# cannot authenticate is exactly the failure this tier exists to catch, and a
# readiness endpoint that lied about it would hide the failure. It is also, as
# measured, not hypothetical: the first run of this tier brought the whole stack
# up green and then could not sign a single person in.
#
# ---------------------------------------------------------------------------
# SECRETS
# ---------------------------------------------------------------------------
# The `identity` fixture credentials and the OIDC signing key below are
# development values for a throwaway database inside a throwaway container.
# They are not secrets and must never be reused: nothing here is reachable
# outside the loopback, and `docker compose down -v` deletes the database they
# live in. What this file must never do is print a *session* token; see
# e2e/artifacts.e2e.spec.ts, which is the test that proves it.

name: ${E2E_STACK_NAME:-parlor-e2e}

networks:
  platform:
    # Not `internal: true`: the image pulls in this stack need the registry, and
    # a compose network with no egress cannot pull. The stack publishes to the
    # host loopback and nowhere else, which is the posture that matters. This
    # reason got STRONGER in the registry change: `identity` and `guard` are
    # pulled, not built, so every run of this tier now depends on that egress.
    driver: bridge

volumes:
  identity-postgres-data:
  guard-redis-data:

services:
  # ----------------------------------------------------------------- registry
  # WHERE THE SIBLING ARTIFACTS COME FROM, and the first service in the file
  # for a reason that is mechanical rather than editorial: `docker compose up`
  # resolves and pulls every `image:` in the document BEFORE it creates any
  # container, so a stack that pulls `identity` and `guard` from a registry
  # that this same compose file is about to start cannot start at all. Compose
  # has no way to express "start this one first, then pull those", so
  # `bin/e2e-stack` brings this service up as its own step before anything else
  # resolves. That ordering lives in the script; the fact that it has to is
  # documented here.
  #
  # IT IS NOT FLEET INFRASTRUCTURE AND IT DOES NOT PERSIST. It is `registry:2`
  # with no volume and no configuration, publishing to 16010, and it holds
  # nothing that outlives `./bin/e2e-stack down`. The tags it serves are
  # `:e2e`-scoped for exactly this reason: the registry is shared infrastructure
  # on a developer's machine and a stack that could overwrite a tag another
  # consumer pins would be a worse bug than a slow one. Never `:latest`.
  #
  # WHY IT IS HERE RATHER THAN ASSUMED: nothing was running on this machine when
  # this was written. The brief expected an existing local registry and there
  # was none — no `registry:2` container, and nothing answering `/v2/` on the
  # usual ports (5000 is macOS AirPlay Receiver, which answers 403 and is not a
  # registry). Kamal's `kamal-local-registry` on this machine is a BUILDER, not
  # a registry: `docker buildx ls` lists the buildkit container and there is no
  # registry server behind it. So the default path is made self-contained
  # rather than assumed, and `E2E_REGISTRY` is the one variable that repoints
  # the whole document at a registry that does persist:
  #
  #     E2E_REGISTRY=registry.internal:5000 ./bin/e2e
  #
  # Nothing else in this file names the registry, so that is the whole change.
  registry:
    image: registry:2
    environment:
      # No auth, and deliberately: this binds to 127.0.0.1 and holds throwaway
      # build output for one test run. A registry that needs credentials to be
      # usable by the thing that publishes to it has made the e2e tier depend on
      # a secret, and this tier's own doctrine (no secrets in a fixture) is
      # better served by not inventing one.
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      # The bare `${E2E_REGISTRY_PORT:-16010}` shape and not `127.0.0.1:...`,
      # because every other published port in this file is the bare shape and
      # tests/validate-ci.sh enforces exactly that. The consequence is stated
      # rather than discovered: this binds all interfaces, not loopback.
      #
      # That is a real posture cost and it is accepted deliberately, on the
      # grounds that (a) it makes the registry indistinguishable in kind from
      # the postgres and redis this same stack already publishes on all
      # interfaces, so it adds no new class of exposure to this document, and
      # (b) what it serves is two throwaway build artifacts with no
      # credentials, deleted by `down -v`. A registry that published a
      # credential would need loopback binding more than this one does, and the
      # day this registry starts holding anything real the binding is the first
      # thing that has to change.
      - "${E2E_REGISTRY_PORT:-16010}:5000"
    healthcheck:
      # `/v2/` is the registry's own API root and it answers 200 once the
      # storage driver is up. registry:2 carries a shell and wget (verified), so
      # unlike identity this healthcheck can actually run inside its container —
      # which matters here because it is the gate on every image pull below.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/v2/"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    networks: [platform]

  # ---------------------------------------------------------------- postgres
  # identity's own database. One container, one database: the platform is
  # database-per-service and a service that reaches into another's database is a
  # bug in review, not a config problem to solve in this file.
  #
  # postgres:17-alpine, the one image the whole fleet uses: this is the same
  # tag identity's own docker-compose.yml carries and the same one core
  # declares, so this harness is not the place where a service is tested
  # against a Postgres version its own repository disagrees with.
  identity-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: identity
    ports:
      # Host side only, and only so `bin/e2e` can prove the database is up
      # before the service that depends on it. The service reaches postgres on
      # the compose network.
      - "${E2E_IDENTITY_POSTGRES_PORT:-16001}:5432"
    volumes:
      - identity-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` with no -U/-d returns true against any database including
      # the bootstrap one, which is the classic "migrations failed against a
      # database that was not ready" flake. Naming the user and the database
      # makes it check the real thing.
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [platform]

  # ----------------------------------------------------------------- identity
  #
  # FINDING, and the reason there is no `healthcheck:` here: identity's image is
  # `gcr.io/distroless/static-debian12:nonroot` (kit's Go template), which has
  # no shell, no `wget` and no `curl`. A compose healthcheck runs *inside* the
  # container it is declared on, so there is nothing in that image that can
  # answer an HTTP probe, and the two available substitutes are both worse than
  # nothing: a `CMD` that exits 0 immediately is a healthcheck that always says
  # healthy, and identity does have a `/readyz` that answers the real question.
  #
  # So identity's readiness is established from the host, by `bin/e2e` polling
  # the published `/readyz` with a bounded budget — which is the mechanism the
  # packet asks for anyway, and the only one that can see a container that
  # cannot see itself. `guard` and `parlor` below do get container healthchecks
  # because their images have a runtime that can fetch, and they are useful:
  # they gate compose's own `depends_on` ordering.
  #
  # The fix belongs in identity's own Dockerfile (a `HEALTHCHECK` needs a probe
  # binary in the image, or a base that has one) and is DECISION NEEDED for the
  # manager. This repository may not modify a sibling.
  #
  # AN `image:` AND NO `build:`, and that absence is the contract. The image is
  # pulled by tag from the registry above, so this tier runs the artifact named
  # `cafaye/identity:e2e` rather than a rebuild of whatever is in `../identity`
  # right now. Read the "NO SIBLING BUILD CONTEXTS" block at the top of this
  # file before changing it: the tag is not a cache, it is the claim that this
  # suite tested a specific published artifact.
  #
  # Developing against an unmerged sibling change is `E2E_BUILD_SIBLINGS=1`,
  # which layers e2e/docker-compose.siblings.yml. That file carries the
  # `build:` stanza and the matching local `image:` — the same tag, so the
  # override changes what the tag RESOLVES TO rather than which service the
  # suite talks to, and a hatch that renamed the image would be a second
  # topology instead of an escape from this one.
  identity:
    image: "${E2E_REGISTRY:-localhost:16010}/cafaye/identity:e2e"
    environment:
      PORT: "8080"
      LOG_LEVEL: debug
      # Over the compose network, by service name. This is the address the
      # harness proves by making a real registration through it.
      DATABASE_URL: "postgres://identity:identity@identity-postgres:5432/identity?sslmode=disable"
      # OIDC is deliberately OFF here, and that is a fact about this stack
      # rather than an omission: identity refuses to boot unless OIDC_ISSUER,
      # OIDC_SIGNING_KEY and OIDC_SIGNING_KEY_ID are all set or all unset
      # (internal/config/config.go, ErrInvalidOIDC — measured, it is the first
      # thing this stack did when it was brought up with only a key). Turning it
      # on needs an https issuer plus a PEM signing key, and neither belongs in
      # a test fixture. So identity serves its /v1 surface and its probes, and
      # publishes no key set. The consequence — guard has no JWKS to verify
      # against, and no test mints a JWT — is stated in the packet report as the
      # reason the suite's guard assertions are about readiness and refusal
      # rather than about a verified token.
    ports:
      - "${E2E_IDENTITY_PORT:-16080}:8080"
    depends_on:
      identity-postgres:
        condition: service_healthy
    networks: [platform]

  # -------------------------------------------------------------------- redis
  # guard's rate-limit counters. One replica makes the in-memory store correct,
  # so Redis is here to prove the *shared* path the moment there are two, and
  # because a Redis probe in guard's `/readyz` is a third service boundary the
  # harness can see.
  guard-redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${E2E_GUARD_REDIS_PORT:-16002}:6379"
    volumes:
      - guard-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    networks: [platform]

  # -------------------------------------------------------------------- guard
  # The same contract as identity, for the same reason and through the same
  # override: an `image:` pulled by tag, no `build:` of its own.
  guard:
    image: "${E2E_REGISTRY:-localhost:16010}/cafaye/guard:e2e"
    environment:
      PORT: "8080"
      NODE_ENV: production
      # Where the /auth surface sends its calls, and what its readiness probe
      # checks. By service name over the compose network.
      IDENTITY_URL: "http://identity:8080"
      # The issuer tokens are *verified* against. guard appends
      # /.well-known/jwks.json itself (identity/internal/oidc/provider.go,
      # PathJWKS; guard/src/middleware/jwt.ts, JWKS_PATH). This is the shape of
      # the three-process chain: a token minted by identity, checked by guard,
      # against a key set fetched from identity. identity publishes no key set
      # in this stack — see the OIDC note above — so the chain is configured and
      # its first two hops are asserted (guard reached identity and redis; guard
      # refuses a caller with no credential) and its third hop is not. A test
      # that cannot be true is worse than a test that is smaller.
      IDENTITY_ISSUER: "http://identity:8080"
      # The shared counter store, so guard's /readyz has a second dependency to
      # report and the shared-allowance path is the one under test.
      REDIS_URL: "redis://guard-redis:6379"
    ports:
      - "${E2E_GUARD_PORT:-16081}:8080"
    depends_on:
      # `service_started` on identity, not `service_healthy`: identity's image
      # cannot carry a healthcheck (see the finding above), and compose would
      # otherwise wait forever for a signal that can never arrive. guard does
      # not need identity to be *ready* to boot — the pool is lazy and the
      # readiness probe reports an unavailable dependency rather than refusing to
      # start — so `bin/e2e`'s host poll is what gates the suite.
      identity:
        condition: service_started
      guard-redis:
        condition: service_healthy
    healthcheck:
      # /healthz, NOT /readyz, and the distinction is guard's own: a dependency
      # outage is /readyz's to report and must not take the gateway out of
      # rotation (../guard/docker-compose.yml says this at the same line). A
      # container healthcheck on /readyz would restart the gateway every time
      # identity hiccuped. Readiness is the harness's job and it is done from
      # outside, on /readyz, in bin/e2e-stack.
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [platform]

  # ------------------------------------------------------------------- parlor
  # The service under test, and the one whose shape this packet changed.
  #
  # IT STILL HAS A `build:`. Every sibling lost its build stanza and this one
  # kept it, and the asymmetry is the whole point rather than an oversight: the
  # point of a test tier is to test the thing being changed, so this image is
  # rebuilt from the working tree on every run. Its siblings are consumed,
  # because rebuilding them was what made this tier test something other than
  # the deployed artifact. If a future packet moves parlor to a tag too, the
  # honest reason has to be "a tag is now published for this repository", not
  # "it saves twenty seconds".
  #
  # There are NO BUILD ARGS, and their absence is the BFF. The image used to be
  # built with `--build-arg NEXT_PUBLIC_IDENTITY_URL=…` pointing at the EDGE's
  # origin, because `next build` inlines `NEXT_PUBLIC_*` into the client bundle
  # and the browser needed to be told where identity was. The browser does not
  # any more: `src/app/v1/[...path]/route.ts` answers `/v1/*` on this app's own
  # origin and forwards to identity from the server.
  #
  # So the address is a plain run-time environment variable, set below, and it is
  # the address a SERVER should use — `http://identity:8080`, the compose-network
  # name, which the browser could never resolve. That is the proof the harness is
  # measuring: if the sign-in path still went through the browser to a public
  # origin, this stack would fail, and it does not.
  #
  # Published on 16003 as well as proxied, so the harness can prove the app is
  # up *as a process* separately from the edge being able to reach it. Two
  # readiness facts, because they fail for different reasons.
  parlor:
    build:
      context: .
      dockerfile: Dockerfile
    image: cafaye/e2e-parlor:local
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Server-side only. Never `NEXT_PUBLIC_*`: that prefix inlines the value
      # into the browser bundle, which is precisely what this packet removed.
      IDENTITY_URL: "http://identity:8080"
      BILLING_URL: "http://billing:3000"
    ports:
      - "${E2E_PARLOR_PORT:-16003}:3000"
    depends_on:
      identity:
        condition: service_started
    healthcheck:
      # Liveness, for the same reason as guard's: a restart should mean "this
      # process is not answering", never "a dependency is unhappy". The same
      # HEALTHCHECK is already in the image's own Dockerfile; it is restated so
      # this file is the one place a reader looks for a service's health.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [platform]

  # --------------------------------------------------------------------- edge
  # The origin a browser actually talks to, and the only reason the sign-in path
  # in this stack works at all. Read e2e/edge.conf before changing anything here:
  # the file states the measured reason this service exists, which routing is
  # deliberate, and which two fixes belong in the real repositories instead.
  #
  # It is last in the document because it depends on both of the services above.
  edge:
    image: nginx:1.27.4-alpine
    volumes:
      # Relative to the *project directory*, which bin/e2e-stack pins to the
      # repository root. Hence `./e2e/edge.conf` and not `./edge.conf` —
      # getting that wrong produces "not a directory: Are you trying to mount a
      # directory onto a file", which is a real message from this run rather
      # than a hypothetical.
      #
      # The `../identity` / `../guard` build contexts that used to sit beside
      # this comment are gone from the default document, so the project
      # directory no longer has to be the repository root for THEM — it still
      # is, because bin/e2e-stack pins it that way and the sibling override
      # resolves its contexts against it. What that means for a reader now:
      # this file's volume paths are anchored at the repository root, and the
      # sibling build contexts in e2e/docker-compose.siblings.yml are anchored
      # at the same place.
      #
      # The leading `./` is load-bearing for a second reason: without it Compose
      # reads a bare relative path as the NAME of a named volume and refuses
      # with "refers to undefined volume", which is also a real message from here.
      - ./e2e/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./e2e/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
    ports:
      - "${E2E_EDGE_PORT:-16000}:3000"
    depends_on:
      parlor:
        condition: service_healthy
      identity:
        condition: service_started
    healthcheck:
      # The app's own liveness, through the proxy. A healthcheck on the edge's
      # port that answered a static file would be a healthcheck on nginx.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    networks: [platform]
