---
# The whole cafaye stack, for the end-to-end suite. This is the topology the
# Playwright specs in this directory drive; `bin/e2e` is the only thing that
# brings it up.
#
# ---------------------------------------------------------------------------
# WHERE THIS TOPOLOGY CAME FROM — read this before adding a service
# ---------------------------------------------------------------------------
# It is NOT a second copy of the platform topology. The topology is owned by two
# places three directories away, and this file is a thin overlay on both:
#
#   ../kit/templates/compose/docker-compose.yml   the local infrastructure a
#       cafaye service joins: Postgres, NATS, Redis, the OTel collector. kit
#       owns those images, their pins and their healthchecks, and the pins
#       there are exact tags. Nothing in this file restates a kit image except
#       where the harness needs a different one and says so.
#
#       kit is now also a REQUIRED CHECKOUT rather than a document this file
#       merely agrees with, and the reason is one bind mount and nothing else:
#       the postgres block mounts `../kit/templates/compose/postgres/initdb`
#       over `/docker-entrypoint-initdb.d`, because the roles identity's
#       migrations protect its tables for are provisioned by that script and by
#       nowhere else. Read "THE CLUSTER, AND THE ROLE ITS MIGRATIONS ASK FOR" at
#       the postgres block below; the one-sentence version is that without the
#       mount this stack has a superuser where a service's bounded owner belongs,
#       and `00016_account_isolation.sql` then fails at `protect_table` with a
#       42704 naming a role nobody created.
#
#   ../caf — `caf dev` renders a compose document from a manifest plus a
#       service catalog (internal/dev/plan.go, internal/dev/registry.go). It
#       plans the *shape*: the project service built from the working tree, its
#       declared dependencies resolved through the registry, the local Postgres
#       and Redis, healthcheck-ordered `depends_on`, and a port-conflict refusal.
#       This file is that plan with three things it cannot express, listed
#       below. The alternative — invoking `caf dev` and then hand-patching its
#       output — was rejected, and the reason is in the report: `caf dev`
#       resolves dependencies to *published images*, and this harness has to
#       consume siblings by tag rather than rebuild them, and it has to pin a
#       port block nothing else on the machine uses.
#
# The three differences from what `caf dev` would render, and why each is here
# rather than a caf feature request:
#
#   1. NO SIBLING BUILD CONTEXTS — this file changed, and the change is the
#      point of the whole contract below. `caf dev` builds the project service
#      and pulls its dependencies; so does this file, for `parlor`. But
#      `identity`, `gateway` and `oauth-stub` carry an `image:` and NO `build:`,
#      so this tier consumes them as published artifacts rather than rebuilding
#      them from `../identity`, `../gateway` and `../oauth-stub` on every run.
#
#      WHY, because "it is faster" is not the reason and the measured numbers
#      say so: a warm full build here is 13.81s and invalidating identity costs
#      20.40s (logs/parlor-registry-e2e-01/README.md, measured). The old
#      `build:` stanzas did not cost minutes. What they cost was that
#      `cafaye/e2e-identity:local` was built from whatever happened to be in
#      the sibling checkout at the instant the suite ran, pushed nowhere, and
#      nameable by nothing outside that docker daemon — so the verification
#      tier could not be shown to test the artifact the fleet deploys, because
#      it tested a different one by construction. "Build once, deploy once, use
#      everywhere" is only true if the verification tier consumes the same
#      artifact, and this is the file that decides whether it does.
#
#      The escape hatch is explicit and off by default: `E2E_BUILD_SIBLINGS=1`
#      layers e2e/docker-compose.siblings.yml, which puts the `build:` stanzas
#      back, for a developer whose sibling change is not merged yet. One
#      documented path, not two defaults.
#
#      `oauth-stub` is in that list because it is a TEST DOUBLE and it is still a
#      sibling: being a fake is a statement about what it answers, not about
#      whether it has a deploy path, a version anybody depends on, or a suite that
#      ought to be the one that runs. Before it existed as a sibling there was no
#      way to run this tier's social path at all — see the `oauth-stub` block.
#   2. A port block nothing else uses. See PORTS below.
#   3. A migration step. Migrations are a deploy step in every service, by
#      policy, so nothing here migrates on boot. `bin/e2e` runs `goose` from the
#      host, which is identity's own documented dev procedure
#      (`../identity/migrations/README.md`, "Running migrations") and is why this
#      file has no goose image: a third-party migration image pinned into the
#      fleet's toolchain is a decision that belongs to identity and the manager,
#      not to a test harness. See DECISION NEEDED in the packet report.
#   4. kit's cluster init script, MOUNTED. `caf dev` plans a local Postgres for
#      the project service and knows nothing about how a role is scoped, so it
#      cannot bring up a cluster whose roles are the ones a service's migrations
#      assume. This is the same class of difference as #3: something the plan
#      describes and cannot express, rather than a second opinion about it.
#
# ---------------------------------------------------------------------------
# PORTS — the 16xxx block, and why
# ---------------------------------------------------------------------------
# Everything published here lands in 16000-16099. The choice is the only free
# decision in this file, so here is the whole reasoning:
#
#   * Not the standard ports. 3000, 8080, 5432 and 6379 are exactly the ports a
#     developer's own `caf dev` stack, a local Postgres and a local Redis are
#     already on. The brief for this file is that a developer's running stack
#     must survive the harness.
#   * Not 15xxx. That block is this workspace's observability stack
#     (cafaye-grafana 15000, postgres 15500, nats 15600/15700, redis 15800,
#     tempo 15900, loki 15901, mimir 15902) and it is *running* right now on
#     the machine this was written on. Two stacks that both believe they own
#     15xxx is a collision the day somebody scales either of them.
#   * 16xxx is adjacent, unallocated, and still a block: 100 ports for an
#     eight-service fleet, and 16000-16099 leaves room for the services this file
#     does not have yet (billing, courier, darkroom, muse) without moving
#     anything.
#   * The layout is by role, not by service, so a reader can guess a port:
#       16000      the origin a browser talks to (the edge)
#       16001-99   everything else, one port each, in service-name order
#   * `parlor` is published on 16003 AND proxied through the edge, rather than
#     only proxied. The harness proves the app is up as a process and that the
#     edge can reach it, and those are two facts that fail for two reasons.
#   * 16004 AND 16005 GO TO THE TWO `oauth-stub` INSTANCES, and the reason they
#     are published at all is the browser rather than the harness. Everything
#     else in the block exists so `bin/e2e` can probe it from the host;
#     `oauth-stub`'s ports exist because the AUTHORIZE leg of a social sign-in is
#     a navigation, so the browser has to be handed an address it can resolve.
#     The compose service name `oauth-stub` is not one — a browser cannot resolve
#     it, which is why identity's `OAUTH_GOOGLE_AUTHORIZE_URL` says
#     `http://127.0.0.1:16004/...` while its token and userinfo URLs say
#     `http://oauth-stub:8080/...`. Read the `oauth-stub` block before moving a
#     number here.
#   * 16004/16005 ARE NOT SITE'S. `site`'s own block publishes its registry on
#     16004 and its two stubs on 16005/16006, so the two stacks are not
#     simultaneously runnable on their defaults — which was already true of
#     16003, 16080 and 16081 before this packet. `tests/validate-ci.sh` checks
#     this block against the ports reserved in the workspace, not against
#     another repository's defaults; if a run ever needs both stacks at once,
#     `E2E_*_PORT` moves this one and nothing in it.
#
# Every published port is `${E2E_*:default}`: a literal port in a compose file
# is a collision the second developer on the machine hits. Change it in the
# environment, not here. The container-side ports are not parameterized —
# those are fixed by the images and by the service contracts.
#
# ---------------------------------------------------------------------------
# READINESS — no sleeps, and the reason is in this file
# ---------------------------------------------------------------------------
# Every service here has a healthcheck, and every one of them probes a
# `/readyz` or its equivalent rather than a port. `docker compose up --wait`
# blocks on those health states, and `bin/e2e` additionally polls the published
# `/readyz` from the host, because a container that is healthy is a claim made
# from inside the network and the browser is not inside the network.
#
# A service with no `/readyz` would be a finding to report, not a reason to
# sleep. All three application services here have one: identity (`/readyz`,
# which pings its database), gateway (`/readyz`, which reports `identity` and
# `redis` by name), and parlor (`/readyz`, currently reporting
# `"deps":"none"` — see AGENTS.md, "Health surfaces").
#
# The edge has no `/readyz` of its own and that is deliberate: it is a proxy, it
# does not implement the platform's health contract, and giving it one would be a
# second answer to a question the contract already has. Its healthcheck asks the
# *app's* liveness through the proxy, which is the only question it can answer.
#
# parlor's `/readyz` NOT probing identity is deliberate and is why the E2E
# spec asserts the user-visible result instead: a stack that comes up and then
# cannot authenticate is exactly the failure this tier exists to catch, and a
# readiness endpoint that lied about it would hide the failure. It is also, as
# measured, not hypothetical: the first run of this tier brought the whole stack
# up green and then could not sign a single person in.
#
# ---------------------------------------------------------------------------
# SECRETS
# ---------------------------------------------------------------------------
# The `identity` fixture credentials and the OIDC signing key below are
# development values for a throwaway database inside a throwaway container.
# They are not secrets and must never be reused: nothing here is reachable
# outside the loopback, and `docker compose down -v` deletes the database they
# live in. What this file must never do is print a *session* token; see
# e2e/artifacts.e2e.spec.ts, which is the test that proves it.

name: ${E2E_STACK_NAME:-parlor-e2e}

networks:
  platform:
    # Not `internal: true`: the image pulls in this stack need the registry, and
    # a compose network with no egress cannot pull. The stack publishes to the
    # host loopback and nowhere else, which is the posture that matters. This
    # reason got STRONGER in the registry change: `identity` and `gateway` are
    # pulled, not built, so every run of this tier now depends on that egress.
    driver: bridge

volumes:
  identity-postgres-data:
  gateway-redis-data:

services:
  # ----------------------------------------------------------------- registry
  # WHERE THE SIBLING ARTIFACTS COME FROM, and the first service in the file
  # for a reason that is mechanical rather than editorial: `docker compose up`
  # resolves and pulls every `image:` in the document BEFORE it creates any
  # container, so a stack that pulls `identity`, `gateway` and `oauth-stub` from a
  # registry that this same compose file is about to start cannot start at all. Compose
  # has no way to express "start this one first, then pull those", so
  # `bin/e2e-stack` brings this service up as its own step before anything else
  # resolves. That ordering lives in the script; the fact that it has to is
  # documented here.
  #
  # IT IS NOT FLEET INFRASTRUCTURE AND IT DOES NOT PERSIST. It is `registry:2`
  # with no volume and no configuration, publishing to 16010, and it holds
  # nothing that outlives `./bin/e2e-stack down`. The tags it serves are
  # `:e2e`-scoped for exactly this reason: the registry is shared infrastructure
  # on a developer's machine and a stack that could overwrite a tag another
  # consumer pins would be a worse bug than a slow one. Never `:latest`.
  #
  # WHY IT IS HERE RATHER THAN ASSUMED: nothing was running on this machine when
  # this was written. The brief expected an existing local registry and there
  # was none — no `registry:2` container, and nothing answering `/v2/` on the
  # usual ports (5000 is macOS AirPlay Receiver, which answers 403 and is not a
  # registry). Kamal's `kamal-local-registry` on this machine is a BUILDER, not
  # a registry: `docker buildx ls` lists the buildkit container and there is no
  # registry server behind it. So the default path is made self-contained
  # rather than assumed, and `E2E_REGISTRY` is the one variable that repoints
  # the whole document at a registry that does persist:
  #
  #     E2E_REGISTRY=registry.internal:5000 ./bin/e2e
  #
  # Nothing else in this file names the registry, so that is the whole change.
  registry:
    image: registry:2
    environment:
      # No auth, and deliberately: this binds to 127.0.0.1 and holds throwaway
      # build output for one test run. A registry that needs credentials to be
      # usable by the thing that publishes to it has made the e2e tier depend on
      # a secret, and this tier's own doctrine (no secrets in a fixture) is
      # better served by not inventing one.
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      # The bare `${E2E_REGISTRY_PORT:-16010}` shape and not `127.0.0.1:...`,
      # because every other published port in this file is the bare shape and
      # tests/validate-ci.sh enforces exactly that. The consequence is stated
      # rather than discovered: this binds all interfaces, not loopback.
      #
      # That is a real posture cost and it is accepted deliberately, on the
      # grounds that (a) it makes the registry indistinguishable in kind from
      # the postgres and redis this same stack already publishes on all
      # interfaces, so it adds no new class of exposure to this document, and
      # (b) what it serves is two throwaway build artifacts with no
      # credentials, deleted by `down -v`. A registry that published a
      # credential would need loopback binding more than this one does, and the
      # day this registry starts holding anything real the binding is the first
      # thing that has to change.
      - "${E2E_REGISTRY_PORT:-16010}:5000"
    healthcheck:
      # `/v2/` is the registry's own API root and it answers 200 once the
      # storage driver is up. registry:2 carries a shell and wget (verified), so
      # unlike identity this healthcheck can actually run inside its container —
      # which matters here because it is the gate on every image pull below.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/v2/"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    networks: [platform]

  # ---------------------------------------------------------------- postgres
  # ONE CLUSTER, provisioned by KIT'S SCRIPT, and both halves of that sentence
  # are a fix rather than a description of how things already were.
  #
  # IT DID NOT RUN KIT'S SCRIPT, and the cost was a red tier that reported the
  # cost rather than the cause. This block used to say `POSTGRES_USER: identity`,
  # `POSTGRES_PASSWORD: identity`, `POSTGRES_DB: identity` and mount nothing over
  # `/docker-entrypoint-initdb.d`. The official image therefore created exactly
  # ONE role — `identity`, a superuser — and no `identity_app`. Then
  # `../identity/migrations/00016_account_isolation.sql` reached
  # `select cafaye.protect_table('account_users')`, which defaults its login role
  # to `current_user || '_app'` and REFUSES to write a policy for a role that
  # cannot log in. Reproduced on this machine against a container built exactly
  # the way this block describes:
  #
  #   ERROR:  cafaye.protect_table(account_users, identity_app):
  #           identity_app is not a LOGIN role on this cluster. (SQLSTATE 42704)
  #
  # Migrations 00008 through 00015 applied cleanly first, which is what made it
  # read like a fault in `00016` rather than in this block. It is not: `00016` is
  # correct and it is identity's first migration to call `protect_table`. It asks
  # for the role the FLEET CONTRACT says the cluster provisions, and the reason it
  # asks is the whole point of the substrate — a second role that owns nothing, so
  # the application cannot `ALTER TABLE ... DISABLE ROW LEVEL SECURITY` over the
  # account boundary it is supposed to be bound by
  # (`../kit/templates/database/tenancy/README.md` §Adopting step 2).
  #
  # So the migration is right, the harness was wrong, and the ONLY honest repair
  # is to provision the cluster the way the fleet provisions one. Making `00016`
  # tolerant — passing an explicit role, skipping the call, catching the error —
  # would convert a stack that is not wired correctly into a stack that boots,
  # and every one of those three turns the row-level-security boundary OFF while
  # the suite went green. This tier exists to fail when the isolation is absent;
  # a fix that removed the isolation would have satisfied the suite by deleting
  # the thing the suite tests.
  #
  # `postgres:17-alpine`, the one image the whole fleet uses: the same tag
  # identity's own docker-compose.yml carries and the same one core declares, so
  # this harness is not the place where a service is tested against a Postgres
  # version its own repository disagrees with. Kit builds its own image on
  # `postgres:17` (Debian) to add pgvector; nothing in this stack uses an
  # extension the alpine image lacks, and the thing that matters here is the init
  # SCRIPT, not the base.
  identity-postgres:
    image: postgres:17-alpine
    environment:
      # `postgres`, and that is the whole of the reason the superuser cannot be
      # named after a service. The official image creates `POSTGRES_USER` as a
      # superuser BEFORE any init script runs, and kit's script then does
      # `CREATE ROLE <name>` for every name in `KIT_POSTGRES_DATABASES` — so the
      # old `POSTGRES_USER: identity` would find the role already there and the
      # whole cluster would refuse to start at initdb:
      #
      #   ERROR:  role "identity" already exists
      #   initdb: /docker-entrypoint-initdb.d/10-cluster.sh: …: exit 3
      #
      # `postgres` is the one role name that is NOT in `KIT_POSTGRES_DATABASES`,
      # which is exactly what makes it the one name that can be this cluster's
      # administrator. Measured on this machine, both ways: with
      # `POSTGRES_USER: identity` and kit's script mounted, the container exits
      # during initdb with `role "identity" already exists` and never opens a
      # socket.
      #
      # It is also a change of what `identity` IS. Before this block, `identity`
      # was a superuser; kit's script creates it `NOSUPERUSER NOCREATEDB
      # NOCREATEROLE NOREPLICATION`, which is the role the fleet contract says a
      # service's migrations run as. That difference is the isolation: a
      # superuser bypasses row-level security entirely, so the previous shape had
      # the policies and no enforcement, which is the same defect as having no
      # policies and is harder to notice because the catalog looks correct.
      #
      # `POSTGRES_DB: postgres` for the same reason. The stock maintenance
      # database already exists, the image has nothing to create, and kit's
      # closing sweep covers every non-template database including this one.
      #
      # `POSTGRES_PASSWORD` is handed to EVERY role kit's script creates, so it
      # is `identity`'s password too, and identity's `DATABASE_URL` and
      # `bin/e2e-stack`'s migrate DSN below both carry it. That is kit's stated
      # position and it is the reason the boundary can be demonstrated by somebody
      # who knows every password in the cluster: isolation here is by PRIVILEGE
      # and never by secret.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # THE DECLARATION, and the only line of it a service adds. Each name becomes
      # a role AND a database owned by that role, plus `<name>_app`, plus the
      # grants, plus a CONNECTION LIMIT, plus the per-database
      # `REVOKE ALL … FROM PUBLIC` that is the isolation this whole change exists
      # to test.
      #
      # NO `:-` DEFAULT, and that is the point: a shared fixture that hardcodes one
      # tenant's name silently provisions that tenant's database for whoever
      # adopts it. kit's script refuses an empty value with a message naming the
      # fix, and a default here would defeat that — so this file states the name
      # and a machine that wants a different stack says so in its own file.
      #
      # NO `KIT_POSTGRES_EXTENSIONS` either, and the omission is kit's shape
      # rather than a smaller one: `create extension` is a CLUSTER decision made
      # once by the operator, because the extension's control file must be
      # `trusted` for a non-superuser to install it and pgvector's is not. Nothing
      # in this stack needs one; `gen_random_uuid()` is in core since PG13.
      KIT_POSTGRES_DATABASES: identity
    ports:
      # Host side only, and only so `bin/e2e` can prove the database is up
      # before the service that depends on it, and so it can run goose against it.
      # The service reaches postgres on the compose network.
      - "${E2E_IDENTITY_POSTGRES_PORT:-16001}:5432"
    volumes:
      - identity-postgres-data:/var/lib/postgresql/data
      # KIT'S SCRIPT, MOUNTED AND NOT COPIED, and that is the decision rather than
      # the convenience. A copy in `e2e/` would be a second opinion about the
      # isolation contract — the exact thing this change exists to remove — and it
      # would be a second opinion that quietly stops being true the moment kit's
      # script changes, with nothing to notice.
      #
      # THE DIRECTORY and not the file, which is kit's own shape and the more
      # robust of the two here. A missing bind source is NOT an error to Docker —
      # it becomes an EMPTY DIRECTORY, initdb runs no script at all, and the
      # cluster comes up with its superuser and nothing else while
      # `docker compose up` exits 0. A per-FILE mount turns a rename or a split of
      # `10-cluster.sh` into "this cluster provisioned nothing" behind a green
      # health check; the directory mount picks up whatever kit puts in it.
      #
      # `../kit/…` and NOT `./…`, and the reason is mechanical: compose resolves a
      # relative bind source against the PROJECT DIRECTORY, which `bin/e2e-stack`
      # pins to the repository ROOT (it has to, so that `context: .` builds this
      # tree). A path written as if it were relative to this file mounts the wrong
      # thing, or the empty directory compose created rather than failing.
      #
      # WHICH IS WHY `../kit` IS NOW A REQUIRED CHECKOUT of this tier, and the cost
      # of that is a fact rather than a preference: the stack needs identity and
      # gateway because of where their image TAGS come from (the registry this run
      # starts holds nothing), and it now needs kit because of this mount, which
      # the registry cannot supply. `.github/workflows/e2e.yml` checks kit out
      # beside the repository and its presence step asserts this file by name, and
      # `bin/e2e-stack`'s preflight refuses to start a stack whose init script is
      # not on disk. Between them, "the cluster came up with no roles" becomes a
      # sentence naming the missing file instead of a 42704 sixty seconds later.
      - ../kit/templates/compose/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `pg_isready` with no -U/-d returns true against any database including
      # the bootstrap one, which is the classic "migrations failed against a
      # database that was not ready" flake. Naming the user and the database
      # makes it check the real thing.
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [platform]

  # ----------------------------------------------------------------- identity
  #
  # FINDING, and the reason there is no `healthcheck:` here: identity's image is
  # `gcr.io/distroless/static-debian12:nonroot` (kit's Go template), which has
  # no shell, no `wget` and no `curl`. A compose healthcheck runs *inside* the
  # container it is declared on, so there is nothing in that image that can
  # answer an HTTP probe, and the two available substitutes are both worse than
  # nothing: a `CMD` that exits 0 immediately is a healthcheck that always says
  # healthy, and identity does have a `/readyz` that answers the real question.
  #
  # So identity's readiness is established from the host, by `bin/e2e` polling
  # the published `/readyz` with a bounded budget — which is the mechanism the
  # packet asks for anyway, and the only one that can see a container that
  # cannot see itself. `gateway` and `parlor` below do get container healthchecks
  # because their images have a runtime that can fetch, and they are useful:
  # they gate compose's own `depends_on` ordering.
  #
  # The fix belongs in identity's own Dockerfile (a `HEALTHCHECK` needs a probe
  # binary in the image, or a base that has one) and is DECISION NEEDED for the
  # manager. This repository may not modify a sibling.
  #
  # AN `image:` AND NO `build:`, and that absence is the contract. The image is
  # pulled by tag from the registry above, so this tier runs the artifact named
  # `cafaye/identity:e2e` rather than a rebuild of whatever is in `../identity`
  # right now. Read the "NO SIBLING BUILD CONTEXTS" block at the top of this
  # file before changing it: the tag is not a cache, it is the claim that this
  # suite tested a specific published artifact.
  #
  # Developing against an unmerged sibling change is `E2E_BUILD_SIBLINGS=1`,
  # which layers e2e/docker-compose.siblings.yml. That file carries the
  # `build:` stanza and the matching local `image:` — the same tag, so the
  # override changes what the tag RESOLVES TO rather than which service the
  # suite talks to, and a hatch that renamed the image would be a second
  # topology instead of an escape from this one.
  identity:
    image: "${E2E_REGISTRY:-localhost:16010}/cafaye/identity:e2e"
    environment:
      PORT: "8080"
      LOG_LEVEL: debug
      # Over the compose network, by service name. This is the address the
      # harness proves by making a real registration through it.
      #
      # THE PASSWORD IS THE CLUSTER'S, not identity's. kit's script hands
      # `$POSTGRES_PASSWORD` to every role it creates — `identity`, `identity_app`
      # and the admin alike — so with `POSTGRES_PASSWORD: postgres` above, this is
      # `postgres`. It reads oddly for a role called `identity`, and it is the
      # change that would be the first thing somebody "tidies" back into an
      # invented password: a password nobody created is a connection refused, and
      # the symptom would be identity's `/readyz` reporting its database
      # unavailable, which reads like a network fault rather than a credential.
      #
      # IT CONNECTS AS THE OWNER, `identity`, and not as `identity_app`. kit's
      # README §Adopting step 2 asks a service to point its application at the
      # non-owner role, and this stack does not, so the process that serves the
      # browser holds the one privilege the substrate exists to take away from it:
      # it could `ALTER TABLE account_users DISABLE ROW LEVEL SECURITY`. What
      # still holds is what `FORCE` buys, and it is measured rather than assumed —
      # run as `identity` with an account identity set, a session reads its own
      # account's row and not another's, and with no identity set it reads zero
      # (see HANDOFF-parlor-e2e-protect-table-01.md §3). The remaining gap is the
      # ability to remove the policies, and closing it means editing identity's
      # `DATABASE_URL`, which is a sibling repository this one may not modify; it
      # is DECISION NEEDED in the handoff rather than quietly fixed by pointing
      # this stack at a role identity's own compose does not use.
      DATABASE_URL: "postgres://identity:postgres@identity-postgres:5432/identity?sslmode=disable"
      # OIDC is ON, and it is ON because the gateway made it non-optional.
      #
      # With this block absent, identity serves its /v1 surface and its probes
      # and publishes no key set — and the gateway, which is configured below
      # with `IDENTITY_ISSUER: http://identity:8080`, answers /readyz with
      # `{"deps":{"identity":"unavailable","redis":"ok"}}` forever. Its identity
      # probe fetches the issuer's JWKS (internal/httpapi/runtime.go,
      # keySetProbe), gets a 404 for a path this service does define, and
      # reports a dependency failure. `bin/e2e-stack up` then spends its whole
      # readiness budget proving it and brings the tier down without running a
      # single test.
      #
      # The old comment here said the absence was deliberate and argued that an
      # https issuer plus a PEM key "belong in no test fixture". Both halves of
      # that were wrong in a way worth recording. `OIDC_ALLOW_INSECURE` exists
      # for exactly this case — an http issuer on localhost — and the key is
      # not committed: `bin/e2e-stack` generates one with openssl at bring-up
      # and hands it to this file through the environment, so no private key
      # enters the repository and gitleaks has nothing to find.
      #
      # `OIDC_ISSUER` is `http://identity:8080` and NOT a published port. It is
      # the compose service name because the value is identity-context: every
      # verifier on the platform compares `iss` for equality against the token,
      # and the gateway's `IDENTITY_ISSUER` below is the same string. A
      # published port here would produce a discovery document the gateway
      # rejects.
      OIDC_ISSUER: "http://identity:8080"
      OIDC_SIGNING_KEY: "${OIDC_SIGNING_KEY:-}"
      OIDC_SIGNING_KEY_ID: "e2e-signing-key"
      # See the paragraph above: this is the localhost case the variable exists
      # for. It is required, not advisory — identity refuses to boot on an http
      # issuer without it (internal/config, ErrInsecureOIDCIssuer).
      OIDC_ALLOW_INSECURE: "true"
      # Where a browser goes to authenticate. Required whenever the block above
      # is present, and this is the browser-context origin for the same reason
      # `OAUTH_REDIRECT_BASE_URL` below is: a page identity redirects to has to
      # be a page the browser can actually load.
      OIDC_LOGIN_UI_URL: "http://127.0.0.1:${E2E_EDGE_PORT:-16000}/login"
    # -------------------------------------------------------------------
      # SOCIAL LOGIN — the fake provider, and the seven overrides that make the
      # round trip testable at all
      # -------------------------------------------------------------------
      # Social sign-in in this repository was, until parlor-e2e-social-01, only
      # ever tested against a fake inside identity's own package. That is the
      # right way to test identity's client and it is structurally incapable of
      # testing a DEPLOYMENT, because the thing a deployment gets wrong is
      # `OAUTH_REDIRECT_BASE_URL` and that value is not in identity's code at all.
      # This block is what makes the round trip testable: a real identity process,
      # a real provider at the far end, and one value here that nothing below the
      # service could ever see.
      #
      # `OAUTH_REDIRECT_BASE_URL` IS THE ONE THAT MATTERS, and it is written as an
      # interpolation of the EDGE's own published port rather than a literal —
      # the EDGE, not `parlor`'s, because the browser is on the edge and the
      # `__Host-oauth-state` cookie is scoped to the origin the 302 arrived on.
      # identity builds every provider callback from this value and never from the
      # request's `Host` (oauth.Provider.RedirectURI says why: a host an attacker
      # chose must not become part of a redirect_uri). So a deployment that points
      # it at identity's own address completes the ENTIRE round trip with the
      # provider — 302, code, exchange, userinfo — and fails at the last step, or
      # sets the session cookie where the app is not. Deriving it from
      # `${E2E_EDGE_PORT}` also means it cannot drift from the port the browser is
      # actually on.
      #
      # It is the EDGE and not parlor's published port for a second reason that
      # only this repository has: the callback has to be a route this app RENDERS.
      # `src/routes/v1/auth/oauth/$provider/callback.tsx` branches on
      # `Accept: text/html` and serves a document for a navigation, so the callback
      # lands on a page that runs one programmatic exchange. Point the redirect at
      # `http://identity:8080` and the browser gets identity's JSON instead of a
      # page — a 200 the whole way through that leaves a person reading a token.
      OAUTH_REDIRECT_BASE_URL: "http://127.0.0.1:${E2E_EDGE_PORT:-16000}"
      # Fixture client credentials, one pair PER PROVIDER because two real
      # providers do not share a client id. A provider with BOTH halves is what
      # mounts the social routes at all, and a provider with one half is a startup
      # FAILURE (oauth.Settings.Validate), so neither may be emptied "to disable a
      # provider" — the way to turn social login off is to remove all of them.
      #
      # THE SECRETS BELOW ARE FIXTURES AND THE STUBS ARE TOLD THEM, which is what
      # the `oauth-stub` block's second half exists to make legible: `oauth-stub`
      # accepts EXACTLY ONE pair, so there are TWO stub instances below and not
      # one. The temptation this arrangement invites is the wrong one — pointing
      # identity at the stub's DEFAULTS (`oauth-stub-client`) so a single instance
      # could serve both providers. That makes the harness agree with itself while
      # testing nothing: the credentials exist to be checked, and a fixture that
      # accepts whatever it is handed checks nothing. `oauth-stub/README.md` says it
      # outright — "a fake that accepts any `client_id` will happily complete a flow
      # whose credentials are wrong."
      OAUTH_GOOGLE_CLIENT_ID: "cafaye-e2e-google-client"
      OAUTH_GOOGLE_CLIENT_SECRET: "cafaye-e2e-google-secret"
      OAUTH_GITHUB_CLIENT_ID: "cafaye-e2e-github-client"
      OAUTH_GITHUB_CLIENT_SECRET: "cafaye-e2e-github-secret"
      # Standard base64 of EXACTLY 32 bytes, which is what identity requires
      # (settings.go refuses anything else at boot EVEN WHEN NO PROVIDER IS
      # CONFIGURED — a deployment whose key is wrong should find out at boot, not
      # in front of a person who cannot sign in). It seals the provider's refresh
      # token, which is why it cannot be empty. This value is the SHA-256 of a
      # fixed phrase, so it is reproducible and unmistakably a fixture; it protects
      # a refresh token for a database inside a throwaway container and must never
      # be reused — see SECRETS above.
      #
      # NOTE THE LENGTH: a 32-BYTE key is 44 base64 characters and this is one. A
      # hand-written "32-byte-looking" string decodes to 34 and identity refuses to
      # boot, which is the correct outcome and a confusing one to debug.
      OAUTH_ENCRYPTION_KEY: "58/st5WnNh1whcj4pP02PVGH5MX2No0AMPlvt1l/YVc="
      #
      # THE TWO DIALECTS OF THE ENDPOINT OVERRIDES, and this is the whole reason
      # they are seven variables rather than one provider URL:
      #
      #   * The AUTHORIZE url is BROWSER-CONTEXT. A 302 sends a person to it, so
      #     it must be an address the BROWSER can resolve — hence 127.0.0.1 and the
      #     published port, not the compose name. The compose network name
      #     `oauth-stub` is not resolvable from a browser.
      #   * The TOKEN and USERINFO urls are IDENTITY-CONTEXT. identity dials them
      #     server-side, so they use the compose service name, the same way a deploy
      #     reaches a sibling by service name and never by a published port. This is
      #     deliberate in both directions: if these went through 127.0.0.1 the run
      #     would stop testing whether identity can reach a provider it addresses by
      #     NAME, and if the authorize url went through `oauth-stub` the browser
      #     would get a name it cannot resolve.
      #
      # A real provider needs one address for both dialects; this fixture needs two,
      # because the browser and the server resolve names differently. That is a fact
      # about the fixture, not a shape to copy, and worth knowing before this is read
      # as a deployment shape. What IS the fixture's quirk is that the provider is IN
      # this stack at all, on the same network, rather than on somebody else's DNS.
      #
      # AND ONE PER PROVIDER, because the two dialects are no longer the only thing
      # separating these seven variables: there are two INSTANCES. Each stub accepts
      # one client pair and refuses everything else, so Google and GitHub cannot
      # share one. Every GOOGLE_* url points at `oauth-stub`/16004 and every
      # GITHUB_* url at `oauth-stub-github`/16005, in BOTH dialects — the authorize
      # urls differ in host because of the browser AND in port because of the
      # instance, which are two independent reasons and the port is the new one. A
      # reader who finds the port split puzzling should read the second reason
      # rather than assume the first covers it.
      #
      # The TOKEN paths are each provider's REAL last segment and are not a
      # mistake: `/google/token` and `/github/access_token`. oauth.GitHub() pins
      # `https://github.com/login/oauth/access_token`, and oauth-stub/main.go's
      # `routes()` registers the same two paths for the same reason — GitHub's real
      # endpoint answers a form body where Google's answers JSON, and
      # `golang.org/x/oauth2` picks its parser from the Content-Type. Symmetrising
      # them would make GitHub's exchange a 404 against a fake whose own README calls
      # the asymmetry load-bearing. Check `routes()` rather than assuming one
      # pattern: an asymmetry that looks like a typo is usually the real shape.
      OAUTH_GOOGLE_AUTHORIZE_URL: "http://127.0.0.1:${E2E_OAUTH_STUB_PORT:-16004}/google/authorize"
      OAUTH_GOOGLE_TOKEN_URL: "http://oauth-stub:8080/google/token"
      OAUTH_GOOGLE_USERINFO_URL: "http://oauth-stub:8080/google/userinfo"
      OAUTH_GITHUB_AUTHORIZE_URL: "http://127.0.0.1:${E2E_GITHUB_STUB_PORT:-16005}/github/authorize"
      OAUTH_GITHUB_TOKEN_URL: "http://oauth-stub-github:8080/github/access_token"
      OAUTH_GITHUB_USERINFO_URL: "http://oauth-stub-github:8080/github/user"
      # The address list, dialled only because the fake's `/user` answers with a
      # null email — the case a private GitHub address produces and the reason
      # `Provider.EmailsURL` exists at all. identity's `githubIdentity` only falls
      # back to this when `/user` returns an empty address, which is GitHub's normal
      # answer for a private one. A fake that returned the address on `/user` would
      # leave this variable unused and the branch untested forever — and the branch
      # is the whole reason the GitHub test in social.e2e.spec.ts is its own test.
      OAUTH_GITHUB_EMAILS_URL: "http://oauth-stub-github:8080/github/user/emails"
    ports:
      - "${E2E_IDENTITY_PORT:-16080}:8080"
    depends_on:
      identity-postgres:
        condition: service_healthy
    networks: [platform]

  # -------------------------------------------------------------------- redis
  # gateway's rate-limit counters. One replica makes the in-memory store correct,
  # so Redis is here to prove the *shared* path the moment there are two, and
  # because a Redis probe in gateway's `/readyz` is a third service boundary the
  # harness can see.
  gateway-redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${E2E_GATEWAY_REDIS_PORT:-16002}:6379"
    volumes:
      - gateway-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    networks: [platform]

  # ------------------------------------------------------------------ gateway
  # The same contract as identity, for the same reason and through the same
  # override: an `image:` pulled by tag, no `build:` of its own.
  gateway:
    image: "${E2E_REGISTRY:-localhost:16010}/cafaye/gateway:e2e"
    environment:
      PORT: "8080"
      NODE_ENV: production
      # Where the /auth surface sends its calls, and what its readiness probe
      # checks. By service name over the compose network.
      IDENTITY_URL: "http://identity:8080"
      # The issuer tokens are *verified* against. gateway appends
      # /.well-known/jwks.json itself (identity/internal/oidc/provider.go,
      # PathJWKS; gateway/src/middleware/jwt.ts, JWKS_PATH). This is the shape of
      # the three-process chain: a token minted by identity, checked by gateway,
      # against a key set fetched from identity. identity DOES publish a key set in
      # this stack — see the OIDC note above, which used to say the opposite and
      # was wrong — so the first two hops are live and asserted (gateway reached
      # identity and redis; gateway refuses a caller with no credential) while
      # the third is still unasserted: no test registers an OIDC client and runs
      # the authorization-code flow, so nothing yet mints a token for gateway to
      # verify against that key set. A key set that is fetchable is not a key
      # set that is exercised, and this comment should not imply either.
      IDENTITY_ISSUER: "http://identity:8080"
      # The shared counter store, so gateway's /readyz has a second dependency to
      # report and the shared-allowance path is the one under test.
      REDIS_URL: "redis://gateway-redis:6379"
    ports:
      - "${E2E_GATEWAY_PORT:-16081}:8080"
    depends_on:
      # `service_started` on identity, not `service_healthy`: identity's image
      # cannot carry a healthcheck (see the finding above), and compose would
      # otherwise wait forever for a signal that can never arrive. gateway does
      # not need identity to be *ready* to boot — the pool is lazy and the
      # readiness probe reports an unavailable dependency rather than refusing to
      # start — so `bin/e2e`'s host poll is what gates the suite.
      identity:
        condition: service_started
      gateway-redis:
        condition: service_healthy
    healthcheck:
      # /healthz, NOT /readyz, and the distinction is gateway's own: a dependency
      # outage is /readyz's to report and must not take the gateway out of
      # rotation (../gateway/docker-compose.yml says this at the same line). A
      # container healthcheck on /readyz would restart the gateway every time
      # identity hiccuped. Readiness is the harness's job and it is done from
      # outside, on /readyz, in bin/e2e-stack.
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [platform]

  # ------------------------------------------------------------------- parlor
  # The service under test, and the one whose shape this packet changed.
  #
  # IT STILL HAS A `build:`. Every sibling lost its build stanza and this one
  # kept it, and the asymmetry is the whole point rather than an oversight: the
  # point of a test tier is to test the thing being changed, so this image is
  # rebuilt from the working tree on every run. Its siblings are consumed,
  # because rebuilding them was what made this tier test something other than
  # the deployed artifact. If a future packet moves parlor to a tag too, the
  # honest reason has to be "a tag is now published for this repository", not
  # "it saves twenty seconds".
  #
  # There are NO BUILD ARGS, and their absence is the BFF. The image used to be
  # built with `--build-arg NEXT_PUBLIC_IDENTITY_URL=…` pointing at the EDGE's
  # origin, because that framework inlined `NEXT_PUBLIC_*` into the client bundle
  # and the browser needed to be told where identity was. The browser does not
  # any more: `src/app/v1/[...path]/route.ts` answers `/v1/*` on this app's own
  # origin and forwards to identity from the server.
  #
  # So the address is a plain run-time environment variable, set below, and it is
  # the address a SERVER should use — `http://identity:8080`, the compose-network
  # name, which the browser could never resolve. That is the proof the harness is
  # measuring: if the sign-in path still went through the browser to a public
  # origin, this stack would fail, and it does not.
  #
  # Published on 16003 as well as proxied, so the harness can prove the app is
  # up *as a process* separately from the edge being able to reach it. Two
  # readiness facts, because they fail for different reasons.
  parlor:
    build:
      context: .
      dockerfile: Dockerfile
    image: cafaye/e2e-parlor:local
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Server-side only. Never `NEXT_PUBLIC_*`: that prefix inlines the value
      # into the browser bundle, which is precisely what this packet removed.
      IDENTITY_URL: "http://identity:8080"
      BILLING_URL: "http://billing:3000"
    ports:
      - "${E2E_PARLOR_PORT:-16003}:3000"
    depends_on:
      identity:
        condition: service_started
    healthcheck:
      # Liveness, for the same reason as gateway's: a restart should mean "this
      # process is not answering", never "a dependency is unhappy". The same
      # HEALTHCHECK is already in the image's own Dockerfile; it is restated so
      # this file is the one place a reader looks for a service's health.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [platform]

  # --------------------------------------------------------------- oauth-stub
  # The fake identity provider, as a PUBLISHED SIBLING.
  #
  # It is a sibling and it is a test double, and both of those are load-bearing
  # for different reasons. It is a sibling because `github.com/cafaye/oauth-stub`
  # has a repository, a release tag (`v0.1.0`, which `bin/e2e-stack` pins), a
  # Dockerfile and a suite — so it is consumed by tag like `identity` and
  # `gateway`, and `publish-siblings` builds and pushes it. It is a test double
  # because its README's first line is `THIS IS A TEST DOUBLE. NEVER DEPLOY IT.`
  # and because everything it answers is chosen to exercise a branch.
  #
  # Before this existed there was NO WAY TO RUN THE SOCIAL PATH HERE AT ALL. Every
  # test of it, in every repository, stubbed the upstream inside identity's own
  # package with an `httptest` server — which tests identity's client and is
  # structurally incapable of testing a DEPLOYMENT, because the thing a
  # deployment gets wrong (`OAUTH_REDIRECT_BASE_URL`) is not in identity's code.
  # That is the whole reason this service and `social.e2e.spec.ts` arrived
  # together; read that spec's header before reading this block.
  #
  # It is placed after `edge` rather than in service-name order because it is the
  # far side of a flow this stack starts. `depends_on` is therefore absent on
  # purpose — see the note on `edge`'s own list, which is the same argument.
  #
  # THIS INSTANCE IS GOOGLE'S, and that is the entire reason a second one exists.
  # oauth-stub holds ONE client id and ONE secret (`OAUTH_STUB_CLIENT_ID`,
  # `OAUTH_STUB_CLIENT_SECRET` — oauth-stub/README.md's table calls the id "the
  # only `client_id` this server accepts") and refuses everything else at both the
  # authorize and the token endpoint. identity holds TWO providers under TWO
  # different ids, as two real providers would be, so one instance cannot serve
  # both: whichever id it was not given gets `invalid_client` on every
  # authorization, and the browser stalls on the provider with an error message
  # that names the variable.
  #
  # THE TWO WAYS OUT WERE BOTH WRONG, and the wrong one is the one that takes five
  # minutes:
  #
  #   * Point identity's client ids at the stub's DEFAULTS so one instance could
  #     take both. This compiles, boots, and tests nothing — the fixture is now
  #     agreeing with itself about a credential neither side independently holds.
  #   * Patch the stub to accept a LIST of clients. `github.com/cafaye/oauth-stub`
  #     is a separate published repository with its own release and its own suite,
  #     and a weaker credential check is a change to the thing under test, made by
  #     the harness, to make a test pass. This repository may not modify a sibling.
  #
  # So there are two instances, one per provider, each told its own pair. The cost
  # is a few MB of a second container against a fixture that cannot see it, and it
  # is worth it in a tier whose stated subject is "a deployment fact nothing below
  # could ever see".
  oauth-stub:
    image: "${E2E_REGISTRY:-localhost:16010}/cafaye/oauth-stub:e2e"
    environment:
      # The bind address, under the PUBLISHED repository's variable name and not
      # any older spelling. Every variable in oauth-stub is optional and ABSENT IS
      # A SUPPORTED STATE, so a variable this harness names wrongly does not fail —
      # it is silently ignored and the service listens on its own default. A
      # renamed variable that reads as a no-op is the failure mode worth naming,
      # because there is no error to notice.
      OAUTH_STUB_ADDR: ":8080"
      # THE CREDENTIALS THIS INSTANCE ACCEPTS, and they are the ones identity's
      # `OAUTH_GOOGLE_CLIENT_ID`/`_SECRET` carry. Absent is a supported state, so
      # with these missing this instance would take its own defaults
      # (`oauth-stub-client`) and refuse every authorize leg identity sent. No
      # harness assertion would fail; all three social tests would simply stop at
      # the provider.
      OAUTH_STUB_CLIENT_ID: "cafaye-e2e-google-client"
      OAUTH_STUB_CLIENT_SECRET: "cafaye-e2e-google-secret"
      # The domain minted addresses are built in. `example.test` is RFC 6761's
      # reserved TLD, so a stray message to one of these accounts is a no-op
      # rather than a delivery — the same reason `session.e2e.spec.ts` mints
      # `example.test` addresses.
      #
      # IT IS SET ON BOTH INSTANCES AND MUST STAY IDENTICAL BETWEEN THEM, because
      # `social.e2e.spec.ts` asserts one address SHAPE rather than one value: the
      # fake mints a fresh address per authorization, and the two providers mint
      # separately so that a shared address would mean one person handed out twice.
      # Two instances with two different domains would still satisfy that
      # assertion, so a difference here is a fact to hold rather than one a test
      # can check.
      OAUTH_STUB_EMAIL_DOMAIN: "example.test"
    ports:
      # The one published port in this file whose reason is not "so the harness can
      # probe it from the host": the BROWSER reaches the provider here, because the
      # authorize leg is a navigation and `oauth-stub` is a name a browser cannot
      # resolve. See the PORTS section for the whole argument.
      #
      # 16004 is the next free port in this document's own ordering after 16003,
      # and `tests/validate-ci.sh` checks all three claims about it — inside
      # 16000-16099, no collision with a reserved workspace port, and that
      # Playwright's fallback is this document's number — rather than trusting this
      # paragraph.
      - "${E2E_OAUTH_STUB_PORT:-16004}:8080"
    # FINDING: NO `healthcheck:`, AND IT IS NOT AN OMISSION.
    #
    # oauth-stub's image is `gcr.io/distroless/static-debian12:nonroot`, which
    # carries no `wget`, no `curl` and no shell, so there is nothing inside the
    # container that could answer a probe. A `healthcheck:` here would always
    # report healthy, which is worse than reporting nothing — it converts a missing
    # signal into a false one, and `docker compose up --wait` would then gate on it.
    #
    # Its own README states the arrangement and `bin/e2e-stack` implements it:
    # `oauth-stub` is in READY_SERVICES, so its `/readyz` is polled FROM THE HOST
    # over the port above, with a bounded budget. That is the same mechanism
    # identity gets, and the reason is identical.
    networks: [platform]

  # -------------------------------------------------------- oauth-stub-github
  # THE SAME IMAGE, THE SECOND INSTANCE, and GitHub's rather than Google's.
  #
  # Everything above it that is about oauth-stub's NATURE — distroless, a published
  # sibling rather than a copy, no in-container probe, a published port because a
  # browser must reach it — is a property of the IMAGE, and one copy of that
  # argument is the right number. What is NOT repeated by reference is the
  # FINDING, and that is deliberate: `tests/validate-ci.sh` requires a service with
  # no `healthcheck:` to carry `FINDING` in its OWN block, so this block states it
  # rather than trusting a reader to carry it across.
  #
  # WHY IT EXISTS AT ALL is the block above's "THIS INSTANCE IS GOOGLE'S": one
  # client pair per instance, two pairs to configure, so two instances. This one
  # carries GitHub's, and identity's `OAUTH_GITHUB_*` overrides point at it in BOTH
  # dialects — by service name for the token and userinfo legs, by published port
  # for the authorize leg, which is a browser navigation.
  oauth-stub-github:
    image: "${E2E_REGISTRY:-localhost:16010}/cafaye/oauth-stub:e2e"
    environment:
      # The bind address, the same 8080 every application service here uses. It is
      # 8080 on BOTH instances deliberately: the container-side port is not part of
      # what makes this instance GitHub's, and two instances claiming different
      # internal ports would only add a way for the two to be confused.
      OAUTH_STUB_ADDR: ":8080"
      # GitHub's pair, matching identity's `OAUTH_GITHUB_CLIENT_ID`/`_SECRET`.
      OAUTH_STUB_CLIENT_ID: "cafaye-e2e-github-client"
      OAUTH_STUB_CLIENT_SECRET: "cafaye-e2e-github-secret"
      # Same domain as the other instance, for the reason given there.
      OAUTH_STUB_EMAIL_DOMAIN: "example.test"
    ports:
      # 16005, the next free number after 16004, and the same three claims about
      # it are checked by `tests/validate-ci.sh` rather than asserted here.
      #
      # It is a VARIABLE, not a literal, because every published port here is one
      # (see PORTS above). And the escape hatch the PORTS block offers for a
      # transient occupier is NARROWER than a single-port stack: moving ONE
      # instance means moving one variable, and moving both means moving both
      # together. That is the real cost of the second instance and it is stated here
      # rather than discovered by the next person to hit it.
      - "${E2E_GITHUB_STUB_PORT:-16005}:8080"
    # FINDING: NO `healthcheck:`, FOR THE SAME REASON AS `oauth-stub`.
    #
    # Same image — `gcr.io/distroless/static-debian12:nonroot`, no `wget`, no
    # `curl`, no shell — so nothing inside this container can answer a probe
    # either, and a `healthcheck:` would report healthy forever. `bin/e2e-stack`
    # polls this instance's `/readyz` from the host over the port above, because
    # `oauth-stub-github` is in READY_SERVICES for exactly the reason `oauth-stub`
    # is: leaving it out is the silent gap that array's own comment warns about, and
    # this instance is the one a GitHub sign-in dials.
    networks: [platform]

  # --------------------------------------------------------------------- edge
  # The origin a browser actually talks to, and the only reason the sign-in path
  # in this stack works at all. Read e2e/edge.conf before changing anything here:
  # the file states the measured reason this service exists, which routing is
  # deliberate, and which two fixes belong in the real repositories instead.
  #
  # It is last in the document because it depends on both of the services above.
  edge:
    image: nginx:1.27.4-alpine
    volumes:
      # Relative to the *project directory*, which bin/e2e-stack pins to the
      # repository root. Hence `./e2e/edge.conf` and not `./edge.conf` —
      # getting that wrong produces "not a directory: Are you trying to mount a
      # directory onto a file", which is a real message from this run rather
      # than a hypothetical.
      #
      # The `../identity` / `../gateway` build contexts that used to sit beside
      # this comment are gone from the default document, so the project
      # directory no longer has to be the repository root for THEM — it still
      # is, because bin/e2e-stack pins it that way and the sibling override
      # resolves its contexts against it. What that means for a reader now:
      # this file's volume paths are anchored at the repository root, and the
      # sibling build contexts in e2e/docker-compose.siblings.yml are anchored
      # at the same place.
      #
      # The leading `./` is load-bearing for a second reason: without it Compose
      # reads a bare relative path as the NAME of a named volume and refuses
      # with "refers to undefined volume", which is also a real message from here.
      - ./e2e/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./e2e/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
    ports:
      - "${E2E_EDGE_PORT:-16000}:3000"
    depends_on:
      parlor:
        condition: service_healthy
      identity:
        condition: service_started
      #
      # NEITHER STUB IS HERE, and that is not an oversight. `depends_on` orders
      # BOOT, and nothing in this stack boots a sign-in: a provider is dialled
      # during a social sign-in, which is a browser action the harness takes
      # after the gate has already passed. Listing them would be a false
      # dependency in the direction that matters — a fixture's outage would
      # become "the edge does not start", which is a sentence about the harness
      # wearing the costume of a fact about the product. The real ordering is
      # `bin/e2e-stack`'s bounded host poll on both `/readyz`, which is in
      # READY_SERVICES.
    healthcheck:
      # The app's own liveness, through the proxy. A healthcheck on the edge's
      # port that answered a static file would be a healthcheck on nginx.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    networks: [platform]
