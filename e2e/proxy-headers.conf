# The proxy headers, once. nginx has no way to factor these out of a `location`
# block except an `include`, and copying six lines into four blocks is how one
# of them ends up saying `X-Forwarded-For $remote_addr` and silently discarding
# the chain the rate limiter is supposed to read.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# `Connection ""` clears the hop-by-hop header nginx would otherwise pass
# upstream from a client's own `Connection: keep-alive`, which is how a
# connection-scoped header ends up on a request it does not belong to.
proxy_set_header Connection "";
