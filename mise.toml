[tools]
# 22.12.0 was the local machine's version, but the jsdom test rig (jsdom@30,
# @asamuzakjp/*, w3c-xmlserializer) now requires ^22.22.2. Pin that floor so
# `npm ci` installs warning-free. Stays on the Node 22 LTS line, matching the
# `node:22-slim` base in the Dockerfile.
#
# This is a MIRROR, not the source. The pin of record is `engines.node` in
# package.json, which npm and CI read; this file is how mise hands a developer
# that same version, and `.npmrc`'s engine-strict is what turns the two
# disagreeing into a red build instead of a surprise.
# `tests/validate-ci.sh` fails when they drift apart. Change the number in
# package.json and here, in the same commit.
node = "22.22.2"

[tasks.test]
description = "Run the vitest suite once"
run = "npm test"

[tasks.lint]
description = "Lint and typecheck"
run = ["npm run lint", "npm run typecheck"]

[tasks.prime]
description = "Fresh checkout: install the lockfile, then prove the tests pass"
run = "./bin/prime"

[tasks."deploy:config"]
# A TIER, not part of the gate, for the same reason `e2e:*` is not: it needs
# `kamal` and `ruby`, and `bin/prime` has to run on a CI runner that has
# neither. The script exits 0 when it proved something, 1 when a property
# failed, and 2 when the binaries are absent and it proved nothing — a third
# value on purpose, so "I could not check" can never read as "I checked".
description = "Render config/deploy.yml and run the real kamal binary against it"
run = "./bin/deploy-config"

[tasks.dev]
description = "Next dev server"
run = "npm run dev"
