---
# The end-to-end tier. Its own workflow, its own job, and NOT part of the `ci`
# workflow — deliberately, twice over.
#
# WHY A SEPARATE WORKFLOW
#   * `bin/prime` is a per-commit gate and the unit tier belongs in it. A whole
#     stack of containers, three image builds and a browser download do not: a
#     gate that takes ten minutes is a gate people stop running, and a gate
#     people stop running is a gate that is not a gate.
#   * The stack needs sibling checkouts, and NOT because a compose file names
#     them as build contexts — `e2e/docker-compose.yml` has no `build:` stanza
#     for any sibling and consumes identity and gateway as `image:` by tag. It
#     needs them because of WHERE those tags come from. The registry in the
#     stack is a `registry:2` container this run starts itself
#     (`bin/e2e-stack` ensure_registry), so it holds nothing when the run
#     begins, and nothing in the fleet publishes to it beforehand. The one path
#     that can fill it is `bin/e2e-stack publish-siblings`, which builds each
#     sibling from a NAMED REF of its checkout, tags it and pushes it — and
#     `ensure_sibling_artifacts` refuses to degrade when a checkout is missing:
#     it exits 1 naming what it could not find. This repository cannot vendor a
#     second copy of a sibling: a copy is a second thing to keep true. So the
#     job checks out the fleet.
#
#     So the job DOES build the fleet, from checkouts, on the default path, and
#     the checkouts are what `publish-siblings` reads rather than what compose
#     reads. `E2E_BUILD_SIBLINGS=1` is the developer's hatch that puts the
#     `build:` stanzas back (e2e/docker-compose.siblings.yml), and this job does
#     not set it.
#
#   * It needs `../kit` TOO, and for a different reason, which is why it is a
#     fourth checkout rather than one more name in the list above. `kit` is not a
#     sibling: no image is built from it, nothing is pushed, and it is not in
#     `SIBLING_SERVICES`. `e2e/docker-compose.yml` MOUNTS
#     `../kit/templates/compose/postgres/initdb` over
#     `/docker-entrypoint-initdb.d`, so the cluster's roles come from that
#     script. The checkout cannot be reached by the registry, cannot be vendored
#     (a copy of the cluster script is a second opinion about the isolation
#     contract, and one that stops being true silently), and is not optional:
#     identity's `migrations/00016_account_isolation.sql` ends in
#     `select cafaye.protect_table('account_users')`, which asks the cluster for a
#     LOGIN role named `identity_app` and refuses to proceed without one. This
#     job was red on exactly that, with a 42704 naming a role nobody had created.
#
#     A runner without `../kit` gets an EMPTY DIRECTORY mounted over initdb — Docker
#     does not fail on a missing bind source — so the cluster comes up with the
#     superuser the image made, passes its health check, and fails sixty seconds
#     later about a role. Both halves of that are silent, which is why the
#     presence step below asserts the directory is non-empty and
#     `bin/e2e-stack`'s `check_cluster_initdb` asserts the same thing again before
#     anything starts.
#   * It is slow and it is not fast-feedback. It runs on push and on pull
#     requests — not nightly, not pre-release — because a nightly E2E is a
#     regression nobody reads about.
#
# WHY IT IS NOT `continue-on-error`
#   PLAN.md §1: "a CI job which silently skips its hard half is worse than no
#   CI, because a green badge is a claim". This job has no soft-fail path at
#   all:
#
#   * `bin/e2e` has no skip mechanism. There is no `test.skip`, no
#     `test.fixme`, no "if the stack is not available" branch, and no
#     environment variable that turns the tier off. The browser is installed or
#     the run fails; the stack comes up or the run fails.
#   * `tests/assert-e2e-ran.mjs` fails the run when the JSON report says fewer
#     than two tests passed, and when anything was skipped. So a `testMatch` that
#     stopped matching is a red build, not a green one over nothing.
#   * `e2e/no-token-artifacts.ts` (Playwright's global teardown) repeats both
#     checks and adds the credential scan, so the guarantees hold for a
#     developer running `npx playwright test` directly as well as for CI.
#
# WHAT THIS JOB IS NOT ALLOWED TO BE
#   A job that can go green without proving the fleet works together. Every step
#   below that looks defensive exists because the failure it catches has already
#   happened somewhere in this fleet.
name: e2e

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here needs a secret. The fixture database, its credentials and the
# OIDC signing key (there is none — see e2e/docker-compose.yml) live inside
# throwaway containers on a throwaway runner. A self-hoster's first question is
# what to put in this file, and the answer is nothing.
jobs:
  e2e:
    name: whole stack, in a browser
    runs-on: ubuntu-latest
    # Generous, and it is a ceiling rather than a target: a cold run builds
    # three images from three toolchains, which is most of the time. A timeout
    # that is too tight turns a slow cold cache into a red build that says
    # nothing; a timeout that is too loose is only paid when something is
    # already wrong, and every long command inside bin/e2e-stack has its own
    # bounded budget and prints the failing container's logs.
    timeout-minutes: 45
    steps:
      # The fleet. These are READ by bin/e2e-stack publish-siblings, which builds
      # the sibling images from a named ref of each and pushes them into the
      # registry this run starts (see the header). A job that checked out only
      # this repository would start a stack whose sibling images exist nowhere,
      # and `docker compose up` would fail pulling them.
      #
      # FOUR checkout steps rather than one with a `path:` list, because `ref`
      # differs between them: this repository is tested at the ref being pushed,
      # and everything else at master. A stack assembled from mismatched service
      # versions is a different artifact with the same name, and pinning the
      # siblings to this ref would mean a green run of a fleet that does not
      # exist.
      #
      # `repository:` IS NOT OPTIONAL ON ANY OF THE FOUR, and the reason is the
      # defect this step arrangement carried for its whole life: an
      # `actions/checkout` with no `repository:` checks out
      # `${{ github.repository }}` — this repository — into whatever directory
      # `path:` names. So `path: identity` held a COPY OF PARLOR and `path: guard`
      # held another copy of parlor in a directory called guard, and the presence
      # assertion below was satisfied by this repository's own Dockerfile while
      # proving nothing whatever about the fleet. The job had never checked out a
      # sibling. A renamed path is not a checkout of a renamed repository, which
      # is why the guard → gateway rename looked like the whole cause.
      - uses: actions/checkout@v7
        with:
          repository: cafaye/parlor
          path: parlor
          ref: ${{ github.ref }}
      - uses: actions/checkout@v7
        with:
          repository: cafaye/identity
          path: identity
          ref: master
      - uses: actions/checkout@v7
        with:
          repository: cafaye/gateway
          path: gateway
          ref: master
      # `kit` IS NOT A SIBLING, and it is here for a reason the other three do
      # not share: no `image:` is built from it, nothing is pushed from it, and it
      # is not in `SIBLING_SERVICES`. `e2e/docker-compose.yml` MOUNTS
      # `../kit/templates/compose/postgres/initdb` over
      # `/docker-entrypoint-initdb.d`, so this checkout is load-bearing for the
      # cluster to be provisioned at all.
      #
      # Which is why it CANNOT be folded into the sibling presence step below, and
      # the difference is the whole of it: the step iterates `SIBLING_SERVICES`
      # because three loops in bin/e2e-stack iterate it, and adding a name to that
      # list to satisfy a mount would make `publish_siblings` look for a build
      # recipe for kit and die with "no build recipe for sibling kit" on the
      # default path. It is a fourth checkout and a fourth assertion, and it
      # asserts the DIRECTORY rather than a Dockerfile because a Dockerfile is
      # what a build reads and this is what a bind mount reads.
      #
      # It is at master for the same reason as the others: kit is the fleet's
      # shared definition, and testing a service against a pinned older cluster
      # script would prove a fleet that does not exist. It also means this job can
      # go red on a kit commit — which is correct, because a cluster-script change
      # IS a change to every service's isolation.
      - uses: actions/checkout@v7
        with:
          repository: cafaye/kit
          path: kit
          ref: master

      - uses: actions/setup-node@v7
        with:
          node-version-file: parlor/package.json

      # `npm ci` and not `npm install`: the lockfile is the contract, and a CI
      # path that resolves a disagreement `npm ci` should have reported is how a
      # green build says something the tree does not contain.
      - name: install the committed lockfile
        working-directory: parlor
        run: npm ci

      # The sibling checkouts have to exist before anything else runs, and
      # asserting it here names the directories in a CI log instead of leaving a
      # reader to work out why `publish-siblings` cannot find a ref.
      #
      # `working-directory: parlor`, and it is the whole of why this step was red
      # on every push: without it the step runs from `$GITHUB_WORKSPACE`, so
      # `../identity` resolves to `/home/runner/work/identity` — BESIDE the
      # workspace, which is where a `path:` checkout puts nothing. Every other
      # `run:` step in this job that reads this repository sets it. (The goose
      # step omits it too and is fine: it reads no file in this repository.)
      - name: the sibling checkouts the stack publishes its artifacts from are present
        working-directory: parlor
        run: |
          set -euo pipefail
          # The list comes out of bin/e2e-stack rather than being restated here.
          # A second copy of the sibling list is a list that goes quiet when a
          # sibling is added, and the hand-written list this replaces named two
          # entries of the fleet while calling one of them `guard` — which is how
          # a step asserting nothing came to look green. `SIBLING_SERVICES` is the
          # list publish_siblings, preflight and ensure_sibling_artifacts all
          # iterate, so a workflow copy could only ever be a claim about it.
          #
          # An EMPTY extraction fails here rather than passing over nothing: a
          # step that can assert zero siblings is a step that can go green
          # without checking one.
          siblings=$(sed -n 's/^SIBLING_SERVICES=(\(.*\))$/\1/p' bin/e2e-stack)
          if [ -z "$siblings" ]; then
            echo "::error::could not read SIBLING_SERVICES as a single-line list out of bin/e2e-stack, so this step asserts nothing" >&2
            exit 1
          fi
          for sibling in $siblings; do
            # TWO requirements per sibling, and they fail differently, so they
            # are two messages. The Dockerfile is what `docker build` reads out
            # of the exported tree. `.git` is what publish-siblings resolves the
            # named ref in, and without it the failure surfaces as "ref not
            # found" — which sends the reader to `git fetch` on a repository
            # that is not there.
            if [ ! -f "../$sibling/Dockerfile" ]; then
              echo "::error::../$sibling/Dockerfile is missing; bin/e2e-stack publish-siblings builds that image from it, and this stack's registry holds nothing until it does" >&2
              exit 1
            fi
            if [ ! -e "../$sibling/.git" ]; then
              echo "::error::../$sibling is not a git checkout; publish-siblings builds from a NAMED REF and cannot name one without a repository" >&2
              exit 1
            fi
            echo "  ../$sibling: present"
          done

          # kit, asserted separately and for a reason that is not tidiness. It is
          # not a sibling: nothing is built from it, `SIBLING_SERVICES` does not
          # name it and must not, and the loop above cannot be extended to reach
          # it without making publish_siblings hunt for a build recipe that does
          # not exist. What consumes it is a BIND MOUNT —
          # e2e/docker-compose.yml puts `../kit/templates/compose/postgres/initdb`
          # over `/docker-entrypoint-initdb.d` — so the assertion is on the
          # directory being non-empty, which is what a mount reads.
          #
          # `find -print -quit` rather than a `[ -f 10-cluster.sh ]`, and it is
          # the same shape as bin/e2e-stack's check_cluster_initdb: the mount is
          # of the DIRECTORY, deliberately, so that a kit that renames or splits
          # its script is picked up rather than silently provisioning nothing. A
          # per-file assertion here would go red on that rename while the mount
          # kept working.
          #
          # Two requirements, two failures. An absent `../kit` is a checkout that
          # did not happen. An EMPTY directory is Docker having mounted the
          # placeholder it creates for a missing bind source — the whole stack
          # comes up healthy and identity's migration 00016 then fails at
          # protect_table with 'identity_app is not a LOGIN role on this cluster',
          # which names a role rather than the checkout that failed to provide it.
          initdb=../kit/templates/compose/postgres/initdb
          if [ ! -d "$initdb" ]; then
            echo "::error::$initdb is missing. e2e/docker-compose.yml mounts it over /docker-entrypoint-initdb.d, so without it this cluster is provisioned by nothing: no service roles, no bounded owner, and no REVOKE — and docker compose reports it healthy anyway." >&2
            exit 1
          fi
          if [ -z "$(find "$initdb" -maxdepth 1 -type f -print -quit 2>/dev/null)" ]; then
            echo "::error::$initdb is empty, which means it was created rather than found: cafaye/kit was not checked out beside this repository. Docker mounts a missing bind source as an empty directory instead of failing." >&2
            exit 1
          fi
          echo "  $initdb: present (kit's cluster script)"

      # identity applies its own migrations with goose, from the host, because
      # migrations are a deploy step and not a boot step (identity/AGENTS.md).
      # Pinned to an exact version for the same reason every other pin in the
      # fleet is: a `@latest` in a CI path is a build that changes under you.
      # `npm ci` has already put Go on the runner via setup-node's sibling? No —
      # GitHub's ubuntu images ship Go, and this step is the one place that
      # depends on that, so the version is printed next to the install.
      - name: install goose, pinned
        run: |
          set -euo pipefail
          go version
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # A checkpoint a reader can see. The three builds are the expensive part
      # of a cold run and `docker compose build` is otherwise a silent
      # ten-minute tool call; bin/e2e-stack prints one line per image and the
      # time each took, and this step makes sure a reader is still there.
      - name: the tier (builds the stack, installs the browser, runs the suite)
        working-directory: parlor
        run: ./bin/e2e

      # The report, uploaded. It is a per-test status list and a stdout/stderr
      # capture — no trace, no video, no network log, which is the whole reason
      # those are off in playwright.config.ts and the reason
      # e2e/no-token-artifacts.ts fails the run if any of them is on. Uploading
      # this is the difference between "the end-to-end tier failed" and a
      # reader being able to see which assertion.
      - name: upload the end-to-end report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: parlor/e2e-results.json
          if-no-files-found: warn
          retention-days: 7

      # Belt and braces, and it is here rather than only inside bin/e2e because
      # this is the step a reviewer reads: the count is printed whatever
      # happened, so "the job is green and the tier ran nothing" is visible in
      # the log rather than inferrable. The same check runs inside the tier; this
      # one is the record.
      - name: the tier ran tests, and skipped none
        if: always()
        working-directory: parlor
        run: node tests/assert-e2e-ran.mjs e2e-results.json
