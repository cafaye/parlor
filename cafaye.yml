# cafaye.yml — DRAFT manifest for parlor.
#
# STATUS: draft. The authoritative cafaye.yml schema lands with `core` v0
# (PLAN.md Phase 0); `core` owns the format and this file gets reconciled when
# it does. Do not build tooling against this shape yet — read it as intent.
#
# What is stable even in draft form:
#   - `healthz` / `readyz` paths and response shapes are the platform contract.
#     Probe them; do not rename them.
#   - `deps: none` is a placeholder that becomes a real dependency list once
#     Phase 2 wires identity/billing/courier checks into /readyz.

apiVersion: cafaye/v0-draft
kind: service

metadata:
  name: parlor
  version: 0.1.0
  summary: >-
    The cafaye app shell: App Router + Tailwind v4 theme, health surfaces and a
    test rig. Template buyers own the resulting code.

spec:
  runtime:
    language: typescript
    framework: nextjs
    node: "22"
    packageManager: npm
    build:
      command: npm run build
      output: standalone
    serve:
      command: npm start
      port: 3000

  http:
    port: 3000
    routes:
      - path: /
        kind: page
        phase: 2
        note: Landing placeholder. Phase 2 replaces it with the product shell.
      - path: /register
        kind: page
        phase: 2
        note: >-
          Account creation. POST /v1/users. A 422 places each failure on its own
          field; a 409 says the address is taken.
      - path: /login
        kind: page
        phase: 2
        note: >-
          Sign in. POST /v1/session. One generic sentence for every refusal, so
          the screen cannot be used to enumerate accounts.
      - path: /healthz
        kind: route
        method: GET
        phase: 1
        probe: liveness
        response:
          status: 200
          body:
            status: ok
      - path: /readyz
        kind: route
        method: GET
        phase: 1
        probe: readiness
        response:
          status: 200
          body:
            status: ok
            deps: none

  # The browser calls identity directly; nothing is proxied through this
  # process, so there is no build-time coupling and no startup check. /readyz
  # still reports "none": a real probe is its own packet, because whether a
  # slow identity should mean "not ready" is a decision and not a default.
  dependencies:
    - name: identity
      phase: 2
      base_url_env: NEXT_PUBLIC_IDENTITY_URL
      default_base_url: http://localhost:8080
      endpoints:
        - POST /v1/users
        - POST /v1/session
        - DELETE /v1/session
        - GET /v1/me
      error_envelope: >-
        RFC 9457 problem+json per core/docs/openapi-conventions.md, with the
        {error:{...}} shape from the identity-02 brief also accepted. Unsettled;
        the client reads both.
      session: >-
        Token in localStorage, not a cookie. The identity session cookie is
        HttpOnly and the browser reaches identity cross-origin, so a BFF route
        owns this before it can be a cookie. See README, "Sessions".

  container:
    image: cafaye/parlor
    dockerfile: Dockerfile
    port: 3000
    user: nextjs

  quality:
    test: npm test
    lint: npm run lint
    typecheck: npm run typecheck
    prime: ./bin/prime
